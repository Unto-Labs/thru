[package]
name = "thru"
version = "0.1.0"
description = "Command-line interface for the Thru blockchain: keys, accounts, transactions, program deployment, and ABI tooling."
license = "Apache-2.0"
repository = "https://github.com/Unto-Labs/thru"
homepage = "https://thru.org/docs/cli-reference/overview/"
edition = "2024"
keywords = ["thru", "cli", "blockchain", "rpc"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "thru"
path = "src/main.rs"

[features]
default = []
# Test-only Speculos emulator transport for Ledger keys (see thru-core).
ledger-speculos = ["thru-core/ledger-speculos"]

[dependencies]
thru-core = { version = "0.1.0", path = "../thru-core" }
anyhow = "1.0"
tokio = { version = "1.52", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
libc = "0.2"
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.8"
thru-base = { version = "0.1.0", path = "../../../thru-base" }
thru-client = { version = "0.1.0", path = "../../../thru-client" }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.5"
