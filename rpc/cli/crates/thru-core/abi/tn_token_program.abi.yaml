- name: TokenError
  kind:
    struct:
      packed: true
      aligned: 0
      comment: null
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            packed: false
            aligned: 0
            comment: null
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction_data_size
              tag-value: 1
              comment: Instruction data is too short or the wrong size for this instruction.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_instruction
              tag-value: 2
              comment: Instruction tag is not a known token instruction.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: insufficient_funds
              tag-value: 4
              comment: Source balance is lower than the amount to transfer or burn.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: owner_mismatch
              tag-value: 5
              comment: Signing authority is not the owner of the token account.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: authority_mismatch
              tag-value: 6
              comment: Signing authority is not the mint authority or freeze authority of the mint.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: missing_required_signer
              tag-value: 7
              comment: Owner or authority of the account did not authorize this transaction.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: account_frozen
              tag-value: 8
              comment: Token account is frozen.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: account_not_owned_by_program
              tag-value: 9
              comment: Account is not owned by the token program.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_mint
              tag-value: 10
              comment: Mint account is not valid.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: non_zero_balance
              tag-value: 11
              comment: Token account still holds a balance and cannot be closed.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_account_data_size
              tag-value: 12
              comment: Account data is not the size of a mint or token account.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: overflow
              tag-value: 13
              comment: Amount is too large and would overflow the balance or supply.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: mint_mismatch
              tag-value: 14
              comment: Token account belongs to a different mint.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: incorrect_program_id
              tag-value: 15
              comment: Program id is not the token program.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_txn
              tag-value: 16
              comment: Transaction is not valid for this instruction.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_proof
              tag-value: 17
              comment: State proof in the instruction data is missing or malformed.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: invalid_account
              tag-value: 18
              comment: Account index is out of range, or the account is not the expected mint or token account.
              variant-type:
                struct:
                  packed: false
                  aligned: 0
                  comment: null
                  fields: []
            - name: mint_cannot_freeze
              tag-value: 19
