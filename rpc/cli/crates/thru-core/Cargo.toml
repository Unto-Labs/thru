[package]
name = "thru-core"
version = "0.1.0"
description = "Shared implementation for the Thru CLI"
license = "Apache-2.0"
repository = "https://github.com/Unto-Labs/thru"
homepage = "https://thru.org/docs/cli-reference/overview/"
edition = "2024"
keywords = ["thru", "cli", "blockchain", "rpc"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
include = ["Cargo.toml", "build.rs", "src/**", "registry/**", "templates/**", "abi/tn_token_program.abi.yaml"]

[features]
default = []
# Test-only: let THRU_LEDGER_SPECULOS=host:port point Ledger keys at a Speculos
# emulator (ledger/sim, rpc/cli/tests/thru_cli_ledger_e2e.sh). Never enable it
# in release builds: any TCP endpoint could then impersonate the Ledger.
ledger-speculos = ["thru-ledger/speculos"]

[dependencies]
# Thru dependencies
thru-client = { version = "0.1.0", path = "../../../thru-client" }
thru-base = { version = "0.1.0", path = "../../../thru-base" }
# Ledger hardware-wallet signer (USB HID). The Speculos emulator transport is
# compiled in only with the `ledger-speculos` feature below (test builds).
thru-ledger = { version = "0.1.0", path = "../../../thru-ledger" }
abi_gen = { package = "thru-abi-gen", version = "0.1.0", path = "../../../abi/abi_gen" }
abi_loader = { package = "thru-abi-loader", version = "0.1.0", path = "../../../abi/abi_loader" }
abi_reflect = { package = "thru-abi-reflect", version = "0.1.0", path = "../../../abi/abi_reflect" }

# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_path_to_error = "0.1"
serde_yml = "0.0.12"
# preserve_order: `thru auth keys create --agent` rewrites MCP client configs
# and keeps their key order.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.9"

# gRPC types (needed for health checks and error handling)
tonic = { version = "0.14.6", features = ["transport", "tls-aws-lc", "tls-webpki-roots"] }
tonic-health = "0.14.6"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Cryptography
hex = "0.4"
sha2 = "0.11"
rand = "0.10.1"
base64 = "0.22"
blst = "0.3"
ed25519-dalek = "2.2"
zeroize = "1.8"
# Recovery phrases (BIP-39) and SLIP-0010 derivation (src/hd.rs)
bip39 = { version = "3.0", features = ["zeroize"] }
hmac = "0.13"

# System utilities
dirs = "6.0"
fs2 = "0.4"
libc = "0.2"
# Machine name for the API key `thru auth login` provisions
gethostname = "1.1"

# DWARF debug info resolution
addr2line = "0.26"
gimli = "0.33"
object = { version = "0.39", default-features = false, features = ["read", "elf", "std"] }

# Output formatting
colored = "3.1"
chrono = "0.4"

# Pattern matching
regex = "1"

# URL handling
url = "2.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

# HTTP client for downloading toolchains
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "charset", "http2", "rustls-tls"] }

# Futures utilities
futures-util = "0.3"

# Archive extraction
tar = "0.4"
flate2 = "1.0"

# Progress indicators
indicatif = "0.18"

[build-dependencies]
serde_json = "1.0"
# Pin versions to avoid vergen-lib conflict (see https://github.com/rustyhorde/vergen/issues/478)
vergen-gitcl = { version = "=9.1.0", features = ["build", "cargo"] }
vergen = "=9.1.0"
vergen-lib = "=9.1.0"

[dev-dependencies]
thru-ledger = { version = "0.1.0", path = "../../../thru-ledger", features = ["speculos", "mock"] }
tokio-test = "0.4"
tempfile = "3.8"
wiremock = "0.6"
assert_matches = "1.5"

# Signing keys stored in the macOS Keychain (`--store keychain`); other
# platforms have no Keychain signing backend.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
# Create-only signing credentials and binary-safe macOS secret buffers.
security-framework = "3.7"
# CFData over a zeroizing seed buffer for SecItemAdd (no extra seed copy).
core-foundation = "0.10"
