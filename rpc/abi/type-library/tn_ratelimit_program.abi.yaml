abi:
  package: thru.program.ratelimit
  name: "Rate Limiter"
  abi-version: 1
  package-version: 0.1.0
  description: >-
    Generic rate limiter that sits in front of a target program. CALL checks
    the forwarded instruction against a policy matcher, charges one call and
    the extracted amount against one bucket per policy rule, then invokes
    the target with the policy (and optionally the policy's authority PDA)
    in its invoke authorization. A target revert reverts the transaction, so
    quota is only consumed by successful calls. All layouts are packed and
    little-endian; every instruction is a u32 discriminant followed by its
    arguments. Accounts are permanent PDAs of this program whose 32-byte
    seed is sha256 of: VERIFIED policy = "tn_ratelimit_verified_policy_v1" ||
    target || policy_id(u64); other policy = "tn_ratelimit_policy_v1" ||
    admin || target || policy_id(u64); bucket = "tn_ratelimit_bucket_v1" ||
    policy || rule_idx(u8) || key; authority = "tn_ratelimit_authority_v1" ||
    policy. Bucket keys are all-zero for GLOBAL rules, the fee payer for
    FEE_PAYER, the address named by the u16 account index at key_offset of
    the forwarded instruction for INSTR_ACCOUNT, and the caller-supplied key
    for ATTESTED. CALL cannot be fully described here because its bucket
    entry count is the policy's rule_cnt (an account field); see CallArgs.
  imports: []
  options:
    program-metadata:
      root-types:
        instruction-root: "RatelimitInstruction"
        account-root: "RatelimitAccount"
        errors: "RatelimitError"
        events: "RatelimitCallEvent"

types:
# ── Shared types ──

- name: Pubkey
  kind:
    struct:
      packed: true
      fields:
      - name: bytes
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8

# key_kind: 0 GLOBAL, 1 FEE_PAYER, 2 INSTR_ACCOUNT, 3 ATTESTED.
# clock: 0 SLOT (window in slots), 1 UNIX_SECONDS (window in block_time
# seconds). window must be non-zero; max_calls and max_amount of zero mean
# unlimited. key_offset is only used by INSTR_ACCOUNT and is the offset of
# a u16 account index in the forwarded instruction.
- name: RatelimitRule
  kind:
    struct:
      packed: true
      fields:
      - name: key_kind
        field-type:
          primitive: u8
      - name: clock
        field-type:
          primitive: u8
      - name: key_offset
        field-type:
          primitive: u16
      - name: window
        field-type:
          primitive: u64
      - name: max_calls
        field-type:
          primitive: u64
      - name: max_amount
        field-type:
          primitive: u64

# The little-endian u16 account index at idx_offset of the forwarded
# instruction must name account address expected.
- name: RatelimitConstraint
  kind:
    struct:
      packed: true
      fields:
      - name: idx_offset
        field-type:
          primitive: u16
      - name: expected
        field-type:
          type-ref:
            name: Pubkey

# Admin-controlled policy configuration. flags: 0x01 PAUSED (the only
# settable flag). The forwarded instruction size must be in
# [instr_sz_min, instr_sz_max]; when selector_sz is non-zero the
# selector_sz-byte value at selector_offset must equal selector_value; the
# first constraint_cnt constraints must hold. When amount_sz is non-zero the
# amount is the amount_sz-byte value at amount_offset (else zero);
# max_amount_per_call of zero means unlimited. selector_sz and amount_sz are
# 0, 1, 2, 4 or 8. attester must be authorized for ATTESTED rules. Only the
# first rule_cnt (1..4) rules are used; unused slots should be zero.
- name: RatelimitConfig
  kind:
    struct:
      packed: true
      fields:
      - name: flags
        field-type:
          primitive: u8
      - name: rule_cnt
        field-type:
          primitive: u8
      - name: constraint_cnt
        field-type:
          primitive: u8
      - name: selector_sz
        field-type:
          primitive: u8
      - name: selector_offset
        field-type:
          primitive: u16
      - name: selector_value
        field-type:
          primitive: u64
      - name: instr_sz_min
        field-type:
          primitive: u16
      - name: instr_sz_max
        field-type:
          primitive: u16
      - name: amount_sz
        field-type:
          primitive: u8
      - name: amount_offset
        field-type:
          primitive: u16
      - name: max_amount_per_call
        field-type:
          primitive: u64
      - name: attester
        field-type:
          type-ref:
            name: Pubkey
      - name: constraints
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              type-ref:
                name: RatelimitConstraint
      - name: rules
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              type-ref:
                name: RatelimitRule

# ── Accounts ──

# magic = 0x7261746C706F6C31 ("ratlpol1"). state_flags: 0x80 VERIFIED (set at
# creation only, when the creator proved it is the target's manager upgrade
# authority).
- name: RatelimitPolicy
  kind:
    struct:
      packed: true
      fields:
      - name: magic
        field-type:
          primitive: u64
      - name: admin
        field-type:
          type-ref:
            name: Pubkey
      - name: target
        field-type:
          type-ref:
            name: Pubkey
      - name: policy_id
        field-type:
          primitive: u64
      - name: state_flags
        field-type:
          primitive: u8
      - name: config
        field-type:
          type-ref:
            name: RatelimitConfig

# magic = 0x7261746C62636B31 ("ratlbck1"). calls/amount count the window
# starting at window_start (now - now % rule.window, in the rule's clock);
# total_* are lifetime statistics.
- name: RatelimitBucket
  kind:
    struct:
      packed: true
      fields:
      - name: magic
        field-type:
          primitive: u64
      - name: policy
        field-type:
          type-ref:
            name: Pubkey
      - name: key
        field-type:
          type-ref:
            name: Pubkey
      - name: rule_idx
        field-type:
          primitive: u8
      - name: window_start
        field-type:
          primitive: u64
      - name: calls
        field-type:
          primitive: u64
      - name: amount
        field-type:
          primitive: u64
      - name: total_calls
        field-type:
          primitive: u64
      - name: total_amount
        field-type:
          primitive: u64

# magic = 0x7261746C61757431 ("ratlaut1").
- name: RatelimitAuthority
  kind:
    struct:
      packed: true
      fields:
      - name: magic
        field-type:
          primitive: u64
      - name: policy
        field-type:
          type-ref:
            name: Pubkey

- name: RatelimitAccount
  kind:
    struct:
      packed: true
      fields:
      - name: data
        field-type:
          size-discriminated-union:
            packed: true
            variants:
            - name: policy
              expected-size: 390
              variant-type:
                type-ref:
                  name: RatelimitPolicy
            - name: bucket
              expected-size: 113
              variant-type:
                type-ref:
                  name: RatelimitBucket
            - name: authority
              expected-size: 40
              variant-type:
                type-ref:
                  name: RatelimitAuthority

# ── Instructions ──

# CREATE_POLICY. admin must be authorized and becomes the policy admin. When
# meta_account_idx is not 0xFFFF it must be the target's manager meta
# account whose authority is admin; the policy is then VERIFIED and lives at
# the VERIFIED policy address. proof is the policy account creation proof.
- name: CreatePolicyArgs
  kind:
    struct:
      packed: true
      fields:
      - name: policy_account_idx
        field-type:
          primitive: u16
      - name: meta_account_idx
        field-type:
          primitive: u16
      - name: admin
        field-type:
          type-ref:
            name: Pubkey
      - name: target
        field-type:
          type-ref:
            name: Pubkey
      - name: policy_id
        field-type:
          primitive: u64
      - name: config
        field-type:
          type-ref:
            name: RatelimitConfig
      - name: proof_sz
        field-type:
          primitive: u16
      - name: proof
        field-type:
          array:
            size:
              field-ref:
                path: [proof_sz]
            element-type:
              primitive: u8

# UPDATE_POLICY replaces the config (target, admin and VERIFIED unchanged).
# Requires admin authorization.
- name: UpdatePolicyArgs
  kind:
    struct:
      packed: true
      fields:
      - name: policy_account_idx
        field-type:
          primitive: u16
      - name: config
        field-type:
          type-ref:
            name: RatelimitConfig

# SET_ADMIN hands the policy to new_admin. Requires admin authorization.
- name: SetAdminArgs
  kind:
    struct:
      packed: true
      fields:
      - name: policy_account_idx
        field-type:
          primitive: u16
      - name: new_admin
        field-type:
          type-ref:
            name: Pubkey

# CREATE_AUTHORITY creates the policy's authority PDA. Requires admin
# authorization. proof is the authority account creation proof.
- name: CreateAuthorityArgs
  kind:
    struct:
      packed: true
      fields:
      - name: policy_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: proof_sz
        field-type:
          primitive: u16
      - name: proof
        field-type:
          array:
            size:
              field-ref:
                path: [proof_sz]
            element-type:
              primitive: u8

# One CALL bucket entry. proof_sz is zero when the bucket already exists.
# key is the caller key for ATTESTED rules and must be zero otherwise.
- name: RatelimitCallBucket
  kind:
    struct:
      packed: true
      fields:
      - name: bucket_account_idx
        field-type:
          primitive: u16
      - name: proof_sz
        field-type:
          primitive: u16
      - name: key
        field-type:
          type-ref:
            name: Pubkey

# CALL fixed header. The wire layout after this header is:
#   RatelimitCallBucket[rule_cnt]  one entry per policy rule, in rule order
#                                  (rule_cnt is the policy account's
#                                  config.rule_cnt, not an instruction field)
#   u8[sum(entry.proof_sz)]        creation proofs of the entries with a
#                                  non-zero proof_sz, in rule order
#   u8[inner_sz]                   the instruction forwarded to the target
# The ABI language cannot size an array from another account, so the tail
# is not modelled; clients must append it. authority_account_idx is 0xFFFF
# or the policy's authority PDA to sign for.
- name: CallArgs
  kind:
    struct:
      packed: true
      fields:
      - name: policy_account_idx
        field-type:
          primitive: u16
      - name: target_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: inner_sz
        field-type:
          primitive: u16

- name: RatelimitInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path: [tag]
            variants:
            - name: create_policy
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreatePolicyArgs
            - name: update_policy
              tag-value: 1
              variant-type:
                type-ref:
                  name: UpdatePolicyArgs
            - name: set_admin
              tag-value: 2
              variant-type:
                type-ref:
                  name: SetAdminArgs
            - name: create_authority
              tag-value: 3
              variant-type:
                type-ref:
                  name: CreateAuthorityArgs
            - name: call
              tag-value: 4
              variant-type:
                type-ref:
                  name: CallArgs

# ── Events ──

# Emitted after every successful CALL. Per-rule arrays are indexed by rule;
# entries at or beyond rule_cnt are zero.
- name: RatelimitCallEvent
  kind:
    struct:
      packed: true
      fields:
      - name: policy
        field-type:
          type-ref:
            name: Pubkey
      - name: amount
        field-type:
          primitive: u64
      - name: window_start
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              primitive: u64
      - name: calls
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              primitive: u64
      - name: amounts
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              primitive: u64

# ── Errors ──

# Revert codes: 0x5201 INVALID_INSTRUCTION, 0x5202 INVALID_ACCOUNT,
# 0x5203 INVALID_CONFIG, 0x5204 UNAUTHORIZED, 0x5205 CREATE_FAILED,
# 0x5206 WRITE_FAILED, 0x5207 PAUSED, 0x5208 TARGET_MISMATCH,
# 0x5209 INSTRUCTION_REJECTED, 0x520A AMOUNT_PER_CALL_EXCEEDED,
# 0x520B BUCKET_MISMATCH, 0x520C ATTESTER_REQUIRED,
# 0x520D CALL_LIMIT_EXCEEDED, 0x520E AMOUNT_LIMIT_EXCEEDED,
# 0x520F TARGET_FAILED. Gated targets revert with 0x52A1 NOT_RATE_LIMITED
# from tn_ratelimit_gate.h.
- name: RatelimitError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
