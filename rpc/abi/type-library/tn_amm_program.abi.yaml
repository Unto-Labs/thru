abi:
  package: thru.program.amm
  name: "AMM Program"
  abi-version: 1
  package-version: 0.3.0
  description: ABI for the Thru AMM program instructions, pool account state, and events
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
    # state_proof
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "AmmInstruction"
        account-root: "AmmProgramAccount"
        errors: "AmmError"
        events: "AmmEvent"
types:
- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8
- name: AmmInitPoolInstruction
  kind:
    struct:
      display-name: Create pool
      packed: true
      fields:
      - name: payer_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: pool_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: pool
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(pool_account_idx)'
        display-name: Pool
        user-display: true
      - name: lp_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lp_mint
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(lp_mint_account_idx)'
        display-name: LP mint
        user-display: true
      - name: vault_one_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: vault_one
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_one_account_idx)'
        display-name: Token one vault
        user-display: true
      - name: vault_two_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: vault_two
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_two_account_idx)'
        display-name: Token two vault
        user-display: true
      - name: mint_one_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: mint_one
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(mint_one_account_idx)'
        display-name: Token one mint
        user-display: true
      - name: mint_two_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: mint_two
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(mint_two_account_idx)'
        display-name: Token two mint
        user-display: true
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: swap_fee_bps
        user-display: false
        field-type:
          primitive: u16
      - name: swap_fee
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: '`${toDecimal(swap_fee_bps, 2)}%`'
        display-name: Swap fee
        user-display: true
      - name: lp_mint_seed
        user-display: false
        field-type:
          type-ref:
            name: Seed32
      - name: pool_proof_size
        user-display: false
        field-type:
          primitive: u64
      - name: lp_mint_proof_size
        user-display: false
        field-type:
          primitive: u64
      - name: vault_one_proof_size
        user-display: false
        field-type:
          primitive: u64
      - name: vault_two_proof_size
        user-display: false
        field-type:
          primitive: u64
      - name: pool_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["pool_proof_size"]
            element-type:
              primitive: u8
      - name: lp_mint_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["lp_mint_proof_size"]
            element-type:
              primitive: u8
      - name: vault_one_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["vault_one_proof_size"]
            element-type:
              primitive: u8
      - name: vault_two_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["vault_two_proof_size"]
            element-type:
              primitive: u8
- name: AmmAddLiquidityInstruction
  kind:
    struct:
      display-name: Add liquidity
      packed: true
      fields:
      - name: pool_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: pool
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(pool_account_idx)'
        display-name: Pool
        user-display: true
      - name: depositor_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: depositor
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(depositor_account_idx)'
        display-name: Depositor
        user-display: true
      - name: depositor_token_one_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: depositor_token_one_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(depositor_token_one_account_idx)'
        display-name: Token one account
        user-display: true
      - name: depositor_token_two_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: depositor_token_two_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(depositor_token_two_account_idx)'
        display-name: Token two account
        user-display: true
      - name: depositor_lp_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: depositor_lp_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(depositor_lp_account_idx)'
        display-name: LP token account
        user-display: true
      - name: vault_one_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: vault_one
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_one_account_idx)'
        display-name: Token one vault
        user-display: true
      - name: vault_two_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: vault_two
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_two_account_idx)'
        display-name: Token two vault
        user-display: true
      - name: lp_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lp_mint
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(lp_mint_account_idx)'
        display-name: LP mint
        user-display: true
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: max_amount_mint_one
        display-name: Max token one in (base units)
        field-type:
          primitive: u64
      - name: max_amount_mint_two
        display-name: Max token two in (base units)
        field-type:
          primitive: u64
      # Inclusive minimum LP output; zero explicitly disables this bound.
      - name: min_lp_out
        user-display: false
        field-type:
          primitive: u64
      - name: min_lp_out_or_none
        type: synthetic
        return-type: { optional: { primitive: u64 } }
        expression: 'if min_lp_out == 0 { none } else { min_lp_out }'
        display-name: Min LP tokens out (base units)
        user-display: true
- name: AmmWithdrawLiquidityInstruction
