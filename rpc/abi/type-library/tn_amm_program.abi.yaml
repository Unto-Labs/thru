- name: AmmInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: discriminant
        user-display: false
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - discriminant
            variants:
            - name: init_pool
              tag-value: 0
              variant-type:
                type-ref:
                  name: AmmInitPoolInstruction
            - name: add_liquidity
              tag-value: 1
              variant-type:
                type-ref:
                  name: AmmAddLiquidityInstruction
            - name: withdraw_liquidity
              tag-value: 2
              variant-type:
                type-ref:
                  name: AmmWithdrawLiquidityInstruction
            - name: swap
              tag-value: 3
              variant-type:
                type-ref:
                  name: AmmSwapInstruction
- name: AmmPoolMetadata
  kind:
    struct:
      display-name: Pool
      packed: true
      fields:
      - name: is_initialized
        user-display: false
        field-type:
          primitive: u8
      - name: initialized
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if is_initialized != 0 { "Yes" } else { "No" }'
        display-name: Initialized
        user-display: true
      - name: locked_lp_supply
        display-name: Locked LP supply (base units)
        field-type:
          primitive: u64
      - name: swap_fee_bps
        user-display: false
        field-type:
          primitive: u16
      - name: swap_fee
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: '`${toDecimal(swap_fee_bps, 2)}%`'
        display-name: Swap fee
        user-display: true
      - name: swap_pool_authority
        display-name: Pool authority
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: mint_one
        display-name: Token one mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: mint_two
        display-name: Token two mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: vault_one
        display-name: Token one vault
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: vault_two
        display-name: Token two vault
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: lp_mint
        display-name: LP mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
- name: AmmProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: pool_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: AmmPoolMetadata
- name: AmmError
  # Code 20 (TN_AMM_ERR_SLIPPAGE_EXCEEDED): an output is below its signed minimum.
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction_data_size
              tag-value: 1
              comment: Instruction data is too short or the wrong size for this instruction.
            - name: invalid_instruction
              tag-value: 2
              comment: Instruction is not a known AMM instruction.
            - name: account_already_initialized
              tag-value: 3
              comment: The pool account already holds data.
            - name: account_not_initialized
              tag-value: 4
              comment: The pool or one of its token accounts is missing or is not a valid account of the expected kind.
            - name: invalid_account_idx
              tag-value: 5
              comment: An account index in the instruction is outside the account list of the transaction.
            - name: invalid_mint_ordering
              tag-value: 6
              comment: The two mints are not in sorted order, or a token account holds a different mint than the pool.
            - name: unauthorized_operation
              tag-value: 7
              comment: The required signer did not authorize this, or an account has the wrong owner.
            - name: pool_create_failed
              tag-value: 8
              comment: The pool account could not be created.
            - name: lp_mint_create_failed
              tag-value: 9
              comment: The LP mint account could not be created.
            - name: vault_one_create_failed
              tag-value: 10
              comment: The first token vault account could not be created.
            - name: vault_two_create_failed
              tag-value: 11
              comment: The second token vault account could not be created.
            - name: account_resize_failed
              tag-value: 12
              comment: The pool account could not be resized, or it is too small to be a pool.
            - name: account_set_writable_failed
              tag-value: 13
              comment: The pool account could not be opened for writing.
            - name: lp_mint_init_failed
              tag-value: 14
              comment: The token program could not set up the LP mint.
            - name: vault_one_init_failed
              tag-value: 15
              comment: The token program could not set up the first token vault.
            - name: vault_two_init_failed
              tag-value: 16
              comment: The token program could not set up the second token vault.
            - name: liquidity_bounds
              tag-value: 17
              comment: An amount or fee is zero, too large, or outside what the pool allows.
            - name: vault_mismatch
              tag-value: 18
              comment: A vault account is not the vault recorded in the pool.
            - name: lp_mint_mismatch
              tag-value: 19
              comment: The LP mint or LP token account does not match the pool.
            - name: slippage_exceeded
              tag-value: 20
              comment: The amount received would be below the minimum set in the transaction.
            - name: invalid_token_program
              tag-value: 21
              comment: The token program account is not the official token program.
