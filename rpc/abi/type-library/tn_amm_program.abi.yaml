        expression: 'accountAddress(user_input_account_idx)'
        display-name: Input token account
        user-display: true
      - name: user_output_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: output_token_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(user_output_account_idx)'
        display-name: Output token account
        user-display: true
      - name: vault_input_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: input_vault
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_input_account_idx)'
        display-name: Input vault
        user-display: true
      - name: vault_output_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: output_vault
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(vault_output_account_idx)'
        display-name: Output vault
        user-display: true
      - name: lp_mint_account_idx
        user-display: false
        field-type:
