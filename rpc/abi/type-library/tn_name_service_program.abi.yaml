abi:
  package: thru.program.name_service
  name: "Name Service"
  abi-version: 1
  package-version: "0.2.0"
  description: ABI for the Thru name service program instruction envelopes and account state
  imports: []
  options:
    program-metadata:
      root-types:
        instruction-root: "NameServiceInstruction"
        account-root: "NameServiceAccount"
        errors: "NameServiceError"
types:
- name: Pubkey
  kind:
    struct:
      packed: true
      fields:
      - name: bytes
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8
- name: KvRecord
  kind:
    struct:
      packed: true
      fields:
      - name: key_length
        field-type:
          primitive: u32
      - name: key
        format: text
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8
      - name: value_length
        field-type:
          primitive: u32
      - name: value
        format: text
        field-type:
          array:
            size:
              literal:
                u64: 256
            element-type:
              primitive: u8
- name: RootRegistrar
  kind:
    struct:
      packed: true
      display-name: Root registrar
      fields:
      - name: root_name_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(root_name, root_name_length)'
        display-name: Root name
        user-display: true
      - name: authority
        display-name: Authority
        field-type:
          type-ref:
            name: Pubkey
      - name: root_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: root_name_length
        user-display: false
        field-type:
          primitive: u32
      - name: total_subdomains
        display-name: Subdomains registered
        field-type:
          primitive: u64
- name: Domain
  kind:
    struct:
      packed: true
      display-name: Domain
      fields:
      - name: domain_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(name, name_length)'
        display-name: Name
        user-display: true
      - name: parent
        display-name: Parent
        field-type:
          type-ref:
            name: Pubkey
      - name: owner
        display-name: Owner
        field-type:
          type-ref:
            name: Pubkey
      - name: name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: name_length
        user-display: false
        field-type:
          primitive: u32
      - name: registration_time
        display-name: Registered at (block time, ns)
        field-type:
          primitive: u64
      - name: record_count
        display-name: Records
        field-type:
          primitive: u32
      - name: records
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["record_count"]
            element-type:
              type-ref:
                name: KvRecord
# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
- name: NameServiceAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: root_registrar_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: RootRegistrar
            - name: domain_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: Domain
- name: InitializeRootArgs
  kind:
    struct:
      packed: true
      display-name: Create root registrar
      fields:
      - name: registrar_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: registrar
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(registrar_account_idx)'
        display-name: Root registrar
        user-display: true
      - name: authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: authority
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(authority_account_idx)'
        display-name: Authority
        user-display: true
      - name: root_name_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(root_name, root_name_length)'
        display-name: Root name
        user-display: true
      - name: root_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: root_name_length
        user-display: false
        field-type:
          primitive: u32
- name: RegisterSubdomainArgs
  kind:
    struct:
      packed: true
      display-name: Register subdomain
      fields:
      - name: domain_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(name, name_length)'
        display-name: Name
        user-display: true
      - name: domain_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(domain_account_idx)'
        display-name: Domain
        user-display: true
      - name: parent_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: parent
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(parent_account_idx)'
        display-name: Parent
        user-display: true
      - name: owner_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(owner_account_idx)'
        display-name: Owner
        user-display: true
      - name: authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: authority
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(authority_account_idx)'
        display-name: Parent authority
        user-display: true
      - name: name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: name_length
        user-display: false
        field-type:
          primitive: u32
- name: AppendRecordArgs
  kind:
    struct:
      packed: true
      display-name: Add domain record
      fields:
      - name: domain_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(domain_account_idx)'
        display-name: Domain
        user-display: true
      - name: owner_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(owner_account_idx)'
        display-name: Owner
        user-display: true
      - name: key_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(key, key_length)'
        display-name: Key
        user-display: true
      - name: value_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(value, value_length)'
        display-name: Value
        user-display: true
      - name: key_length
        user-display: false
        field-type:
          primitive: u32
      - name: key
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8
      - name: value_length
        user-display: false
        field-type:
          primitive: u32
      - name: value
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 256
            element-type:
              primitive: u8
- name: DeleteRecordArgs
  kind:
    struct:
      packed: true
      display-name: Delete domain record
      fields:
      - name: domain_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(domain_account_idx)'
        display-name: Domain
        user-display: true
      - name: owner_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(owner_account_idx)'
        display-name: Owner
        user-display: true
      - name: key_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(key, key_length)'
        display-name: Key
        user-display: true
      - name: key_length
        user-display: false
        field-type:
          primitive: u32
      - name: key
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8
- name: UnregisterArgs
  kind:
    struct:
      packed: true
      display-name: Unregister domain
      fields:
      - name: domain_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(domain_account_idx)'
        display-name: Domain
        user-display: true
      - name: owner_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(owner_account_idx)'
        display-name: Owner
        user-display: true
- name: NameServiceInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        user-display: false
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - tag
            variants:
            - name: initialize_root
              tag-value: 0
              variant-type:
                type-ref:
                  name: InitializeRootArgs
            - name: register_subdomain
              tag-value: 1
              variant-type:
                type-ref:
                  name: RegisterSubdomainArgs
            - name: append_record
              tag-value: 2
              variant-type:
                type-ref:
                  name: AppendRecordArgs
            - name: delete_record
              tag-value: 3
              variant-type:
                type-ref:
                  name: DeleteRecordArgs
            - name: unregister
              tag-value: 4
              variant-type:
                type-ref:
                  name: UnregisterArgs
- name: NameServiceError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction
              tag-value: 1
              comment: Instruction data is too short, the wrong size, or not a known name service instruction.
            - name: invalid_account
              tag-value: 2
              comment: An account index is outside the account list of the transaction, or the account is not the expected name service account.
            - name: unauthorized
              tag-value: 3
              comment: The owner or authority of the domain did not authorize this transaction.
            - name: domain_not_found
              tag-value: 4
              comment: The domain does not exist.
            - name: invalid_domain_name
              tag-value: 5
              comment: The domain name is too short, too long, or contains characters that are not allowed.
            - name: invalid_record_data
              tag-value: 6
              comment: The record key or value is empty or too long.
            - name: max_supply_reached
              tag-value: 7
              comment: No more subdomains can be registered under this registrar.
            - name: invalid_parent
              tag-value: 8
              comment: The parent account is not a registrar or a domain.
            - name: duplicate_key
              tag-value: 9
              comment: The domain already has a record with this key.
            - name: record_not_found
              tag-value: 10
              comment: The domain has no record with this key.
            - name: max_records_reached
              tag-value: 11
              comment: The domain already has the maximum number of records.
