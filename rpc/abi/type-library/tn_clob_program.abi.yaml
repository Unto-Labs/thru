- name: ModifyOrderEntryInstruction
  kind:
    struct:
      display-name: Modify order
      packed: true
      fields:
      - name: instruction_flags
        user-display: false
        field-type:
          primitive: u8
      - name: market_record_idx
        display-name: Market record
        field-type:
          primitive: u8
      - name: reserved0
        user-display: false
        field-type:
          primitive: u8
      - name: order_entry_idx
        display-name: Order entry
        field-type:
          primitive: u32
      - name: action
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if quantity == 0 || exp_time == 0 { "Cancel order" } else { "Reduce quantity or change expiry" }'
        display-name: Action
        user-display: true
      - name: quantity
        display-name: New quantity (base units)
        field-type:
          primitive: u64
      - name: exp_time
        user-display: false
        field-type:
          primitive: i64
      - name: expires_at
        type: synthetic
        return-type: { optional: { type-ref: { name: Text } } }
        expression: 'if exp_time == 0 { none } else { if exp_time < 0 { `Slot ${0 - exp_time}` } else { `Block time ${exp_time} ns` } }'
        display-name: Expires at
        user-display: true
      - name: metadata
        user-display: false
        field-type:
          array:
            size:
              add:
                left:
                  mul:
                    left:
                      bit-and:
                        left:
                          right-shift:
                            left:
                              field-ref:
                                path: ["instruction_flags"]
                            right:
                              literal:
                                u8: 1
                        right:
                          literal:
                            u8: 1
                    right:
                      literal:
                        u64: 16
                right:
                  mul:
                    left:
                      bit-and:
                        left:
                          right-shift:
                            left:
                              field-ref:
                                path: ["instruction_flags"]
                            right:
                              literal:
                                u8: 2
                        right:
                          literal:
                            u8: 1
                    right:
                      literal:
                        u64: 8
            element-type:
              primitive: u8
