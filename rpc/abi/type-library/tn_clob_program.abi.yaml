        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if status_flags == 0 { "No restrictions" } else { `${if status_flags % 2 == 1 { "Paused" } else { "" }}${if (status_flags / 2) % 2 == 1 { if status_flags % 2 != 0 { ", post-only" } else { "Post-only" } } else { "" }}${if (status_flags / 4) % 2 == 1 { if status_flags % 4 != 0 { ", withdrawals frozen" } else { "Withdrawals frozen" } } else { "" }}${if (status_flags / 8) % 2 == 1 { if status_flags % 8 != 0 { ", deposits frozen" } else { "Deposits frozen" } } else { "" }}${if status_flags >= 16 { if status_flags % 16 != 0 { ", unknown flags" } else { "Unknown flags" } } else { "" }}` }'
        display-name: New status
        user-display: true
