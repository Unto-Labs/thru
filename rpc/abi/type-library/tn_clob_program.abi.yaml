# ClobProgramAccount is the account root. Byte 0 of every account the CLOB
# program owns is account_type, one value per (account kind, layout) pair;
# the payload follows immediately. 0 is invalid. Values are never reused: a
# changed layout of an existing kind, or a new kind of account, takes the
# next unused value. Market vaults are token program accounts.
