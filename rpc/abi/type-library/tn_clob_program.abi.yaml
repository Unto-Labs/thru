abi:
  package: thru.program.clob
  name: "CLOB Program"
  abi-version: 1
  package-version: "0.2.0"
  description: ABI for the Thru CLOB program instructions, account state, events, and errors
  imports:
    - type: path
      path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "ClobInstruction"
        account-root: "ClobProgramAccount"
        errors: "ClobError"
        events: "ClobEvent"
types:
- name: ClientId
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 16
      element-type:
        primitive: u8
- name: MarketRecordInstruction
  kind:
    struct:
      display-name: Select market
      packed: true
      fields:
      - name: market_record_idx
        display-name: Market record
        field-type:
          primitive: u8
      - name: seat_arena_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: market
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(seat_arena_account_idx)'
        display-name: Market
        user-display: true
      - name: order_arena_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: bids_cbook_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: asks_cbook_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: seat_authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: seat_authority
        type: synthetic
        return-type: { optional: { type-ref: { name: Pubkey } } }
        expression: 'if seat_authority_account_idx == 65535 { none } else { accountAddress(seat_authority_account_idx) }'
        display-name: Seat authority
        user-display: true
      - name: seat_idx
        user-display: false
        field-type:
          primitive: u32
      - name: seat
        type: synthetic
        return-type: { optional: { primitive: u32 } }
        expression: 'if seat_authority_account_idx == 65535 { none } else { seat_idx }'
        display-name: Seat
        user-display: true
      - name: exchange_meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_program_idx
        user-display: false
        field-type:
          primitive: u16
      - name: base_vault_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: quote_vault_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: market_authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: market_authority
        type: synthetic
        return-type: { optional: { type-ref: { name: Pubkey } } }
        expression: 'if market_authority_account_idx == 65535 { none } else { accountAddress(market_authority_account_idx) }'
        display-name: Market authority
        user-display: true
      - name: reserved0
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 6
            element-type:
              primitive: u8
- name: TokenTransferInstruction
  kind:
    struct:
      display-name: Deposit or withdraw tokens
      packed: true
      fields:
      - name: market_record_idx
        display-name: Market record
        field-type:
          primitive: u8
      - name: token_program_idx
        user-display: false
        field-type:
          primitive: u16
      - name: reserved0
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              primitive: u8
      - name: amount
        display-name: Amount (base units)
        field-type:
          primitive: u64
      - name: from_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: source_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(from_account_idx)'
        display-name: Source token account
        user-display: true
      - name: to_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: destination_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(to_account_idx)'
        display-name: Destination token account
        user-display: true
      - name: reserved1
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type:
              primitive: u8
- name: SeatCreateInstruction
  kind:
    struct:
      display-name: Create seat
      packed: true
      fields:
      - name: market_record_idx
        display-name: Market record
        field-type:
          primitive: u8
      - name: seat_authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: seat_authority
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(seat_authority_account_idx)'
        display-name: Seat authority
        user-display: true
