- name: CreateOrderEntryInstruction
  kind:
    struct:
      display-name: Place order
      packed: true
      fields:
      - name: instruction_flags
        user-display: false
        field-type:
          primitive: u8
      - name: side
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if instruction_flags % 2 == 1 { "Buy" } else { "Sell" }'
        display-name: Side
        user-display: true
      - name: order_type
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if (instruction_flags / 2) % 8 == 0 { "Good till cancelled" } else { if (instruction_flags / 2) % 8 == 1 { "Market to limit" } else { if (instruction_flags / 2) % 8 == 2 { "Post only" } else { if (instruction_flags / 2) % 8 == 3 { "Immediate or cancel" } else { if (instruction_flags / 2) % 8 == 4 { "Fill or kill" } else { `Unknown (${(instruction_flags / 2) % 8})` } } } } }'
        display-name: Order type
        user-display: true
      - name: market_record_idx
        display-name: Market record
        field-type:
          primitive: u8
      - name: reserved0
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 5
            element-type:
              primitive: u8
      - name: price
        display-name: Price (raw)
        field-type:
          primitive: u64
      - name: quantity
        display-name: Quantity (base units)
        field-type:
          primitive: u64
      - name: exp_time
        user-display: false
        field-type:
          primitive: i64
      - name: expires_at
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if exp_time < 0 { `Slot ${0 - exp_time}` } else { `Block time ${exp_time} ns` }'
        display-name: Expires at
        user-display: true
      - name: client_id
        user-display: false
        field-type:
          array:
            size:
              mul:
                left:
                  bit-and:
                    left:
                      right-shift:
                        left:
                          field-ref:
                            path: ["instruction_flags"]
                        right:
                          literal:
                            u8: 6
                    right:
                      literal:
                        u8: 1
                right:
                  literal:
                    u64: 16
            element-type:
              primitive: u8
