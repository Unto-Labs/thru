      - name: client_id
        user-display: false
        field-type:
          array:
            size:
              mul:
                left:
                  bit-and:
                    left:
                      right-shift:
                        left:
                          field-ref:
                            path: ["instruction_flags"]
                        right:
                          literal:
                            u8: 6
                    right:
