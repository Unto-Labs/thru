abi:
  package: thru.program.eoa
  name: EOA
  abi-version: 1
  package-version: 1.0.0
  description: >-
    Externally owned account program. CreateAccount creates an EOA from its
    Ed25519 signature and a creation state proof, Transfer moves native
    balance from an authorized signer, and DeleteAccount deletes an EOA with
    its keyholder's signature. EOA accounts carry no program data.
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: EoaInstruction
        errors: EoaError
types:
  - name: CreateAccountArgs
    kind:
      struct:
        packed: true
        display-name: Create account
        fields:
          - name: proof_size
            user-display: false
            field-type: { primitive: u64 }
          - name: eoa_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: eoa_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(eoa_account_idx)'
            display-name: Account
            user-display: true
          - name: signature
            user-display: false
            field-type:
              type-ref:
                name: Signature
                package: "thru.common.primitives"
          - name: proof
            user-display: false
            field-type:
              array:
                size: { field-ref: { path: [proof_size] } }
                element-type: { primitive: u8 }
  - name: TransferArgs
    kind:
      struct:
        packed: true
        display-name: Transfer native balance
        fields:
          - name: from_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(from_account_idx)'
            display-name: Source account
            user-display: true
          - name: to_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(to_account_idx)'
            display-name: Destination account
            user-display: true
          - name: amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
          - name: amount_thru
            display-name: Amount
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Decimal } }
            expression: 'toDecimal(amount, 9)'
          - name: summary
            display-name: Summary
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Text } }
            expression: '`Send ${amount_thru} THRU to ${to_account}`'
          - name: from_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: to_account_idx
            user-display: false
            field-type: { primitive: u16 }
  - name: DeleteAccountArgs
    kind:
      struct:
        packed: true
        display-name: Delete account
        fields:
          - name: eoa_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: eoa_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(eoa_account_idx)'
            display-name: Account
            user-display: true
          - name: signature
            user-display: false
            field-type:
              type-ref:
                name: Signature
                package: "thru.common.primitives"
  - name: EoaInstruction
    kind:
      struct:
        packed: true
        fields:
          - name: tag
            user-display: false
            field-type: { primitive: u32 }
          - name: payload
            field-type:
              enum:
                packed: true
                tag-ref: { field-ref: { path: [tag] } }
                variants:
                  - name: create_account
                    tag-value: 0
                    variant-type: { type-ref: { name: CreateAccountArgs } }
                  - name: transfer
                    tag-value: 1
                    variant-type: { type-ref: { name: TransferArgs } }
                  - name: delete_account
                    tag-value: 2
                    variant-type: { type-ref: { name: DeleteAccountArgs } }
  - name: EoaError
    kind:
      struct:
        packed: true
        comment: >-
          1 invalid instruction data size, 2 invalid instruction, 3 invalid
          account index, 4 unauthorized operation, 5 account create failed.
          Transfer and DeleteAccount return runtime syscall errors unchanged.
        fields:
          - name: code
            field-type: { primitive: u64 }
          - name: error
            field-type:
              enum:
                tag-ref: { field-ref: { path: [code] } }
                variants:
                  - name: invalid_instruction_data_size
                    tag-value: 1
                    comment: Instruction data is too short or the wrong size for this instruction.
                  - name: invalid_instruction
                    tag-value: 2
                    comment: Instruction is not a known EOA instruction.
                  - name: invalid_account_idx
                    tag-value: 3
                    comment: An account index in the instruction is outside the account list of the transaction.
                  - name: unauthorized_operation
                    tag-value: 4
                    comment: The sending account did not authorize this transfer.
                  - name: account_create_failed
                    tag-value: 5
                    comment: The account could not be created.
