abi:
  package: thru.program.manager
  name: "Manager Program"
  abi-version: 1
  package-version: "0.2.0"
  description: ABI for the Thru manager program instruction envelopes and account state
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
    # state_proof
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "ManagerInstruction"
        account-root: "ManagerProgramAccount"
        errors: "ManagerError"
types:
- name: CreatePermanentArgs
  kind:
    struct:
      packed: true
      display-name: Create program
      fields:
      - name: program_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(program_account_idx)'
        display-name: Program
        user-display: true
      - name: metadata_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(meta_account_idx)'
        display-name: Program metadata
        user-display: true
      - name: authority_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(authority_account_idx)'
        display-name: Authority
        user-display: true
      - name: meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: source_buffer
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(srcbuf_account_idx)'
        display-name: Source buffer
        user-display: true
      - name: srcbuf_offset
        user-display: false
        field-type:
          primitive: u32
      - name: srcbuf_size
        display-name: Program size (bytes)
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # the manager rejects any other bytes.
      - name: srcbuf_sha256
        user-display: false
        field-type:
          type-ref:
            name: Hash
            package: "thru.common.primitives"
      - name: authority_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: seed_len
        user-display: false
        field-type:
          primitive: u32
      - name: seed
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["seed_len"]
            element-type:
              primitive: u8
      - name: meta_state_proof
        user-display: false
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
      - name: program_state_proof
        user-display: false
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
