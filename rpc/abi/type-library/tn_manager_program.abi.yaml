- name: SetPauseArgs
  kind:
    struct:
      packed: true
      display-name: Pause or unpause program
      fields:
      - name: action
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if is_paused == 1 { "Pause" } else if is_paused == 0 { "Unpause" } else { `Invalid (${is_paused})` }'
        display-name: Action
        user-display: true
      - name: program_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(program_account_idx)'
        display-name: Program
        user-display: true
      - name: metadata_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(meta_account_idx)'
        display-name: Program metadata
        user-display: true
      - name: meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: is_paused
        user-display: false
        field-type:
          primitive: u8
- name: HeaderOnlyArgs
  kind:
    struct:
      packed: true
      fields:
      - name: program_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(program_account_idx)'
        display-name: Program
        user-display: true
      - name: metadata_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(meta_account_idx)'
        display-name: Program metadata
        user-display: true
      - name: meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: program_account_idx
        user-display: false
        field-type:
          primitive: u16
- name: SetAuthorityArgs
  kind:
    struct:
      packed: true
      display-name: Propose program authority
      fields:
      - name: program_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(program_account_idx)'
        display-name: Program
        user-display: true
      - name: metadata_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(meta_account_idx)'
        display-name: Program metadata
        user-display: true
      - name: meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: authority_candidate
        display-name: Proposed authority
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
- name: ManagerInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - tag
            variants:
            - name: create_permanent
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreatePermanentArgs
            - name: create_ephemeral
              tag-value: 1
              variant-type:
                type-ref:
                  name: CreateEphemeralArgs
            - name: upgrade
              tag-value: 2
              variant-type:
                type-ref:
                  name: UpgradeArgs
            - name: set_pause
              tag-value: 3
              variant-type:
                type-ref:
                  name: SetPauseArgs
            - name: destroy
              tag-value: 4
              variant-type:
                type-ref:
                  name: HeaderOnlyArgs
            - name: finalize
              tag-value: 5
              variant-type:
                type-ref:
                  name: HeaderOnlyArgs
            - name: set_authority
              tag-value: 6
              variant-type:
                type-ref:
                  name: SetAuthorityArgs
            - name: claim_authority
              tag-value: 7
              variant-type:
                type-ref:
                  name: HeaderOnlyArgs
# Account root. Byte 0 of every account this program owns (other than
# program code accounts, which stay raw) is account_type. Values are never
# reused; a new layout takes the next unused value. Core Manager writes the
# same metadata layout with the same value.
- name: ManagerProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: program_meta_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: ManagerProgramMeta
# Program metadata payload (73 bytes after account_type).
- name: ManagerProgramMeta
  kind:
    struct:
      packed: true
      display-name: Program metadata
      fields:
      - name: authority
        display-name: Authority
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: authority_candidate
        user-display: false
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: version
        display-name: Version
        field-type:
          primitive: u64
      - name: state
        user-display: false
        field-type:
          primitive: u8
      - name: state_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if state == 0 { "Open" } else if state == 1 { "Paused" } else if state == 2 { "Finalized" } else { `Unknown (${state})` }'
        display-name: State
        user-display: true
- name: ManagerError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u16
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: discriminant
              tag-value: 2 # 0x0002
              comment: Instruction is not a known program manager instruction.
            - name: size
              tag-value: 256 # 0x0100
              comment: The account seed is longer than 32 bytes.
            - name: size_instruction
              tag-value: 257 # 0x0101
              comment: Instruction data is too short or the wrong size for this instruction.
            - name: value_instruction
              tag-value: 513 # 0x0201
              comment: The pause flag in the instruction is not 0 or 1.
            - name: size_srcbuf_acc
              tag-value: 259 # 0x0103
              comment: The source range goes past the end of the source buffer account.
            - name: value_srcbuf_acc
              tag-value: 515 # 0x0203
              comment: The source buffer contents do not match the hash in the instruction.
            - name: index_srcbuf_acc
              tag-value: 1027 # 0x0403
              comment: The source buffer account index is outside the account list of the transaction.
            - name: na_srcbuf_acc
              tag-value: 1283 # 0x0503
              comment: The source buffer account does not exist.
            - name: state_srcbuf_acc
              tag-value: 1795 # 0x0703
              comment: The source buffer account is compressed or deleted.
            - name: invalid_program_srcbuf_acc
              tag-value: 2307 # 0x0903
              comment: The source buffer does not hold a valid program image.
            - name: size_meta_acc
              tag-value: 260 # 0x0104
              comment: The metadata account is not a program metadata account.
            - name: authorization_meta_acc
              tag-value: 772 # 0x0304
              comment: The program authority did not authorize this transaction.
            - name: index_meta_acc
              tag-value: 1028 # 0x0404
              comment: The metadata account index is outside the account list of the transaction.
            - name: na_meta_acc
              tag-value: 1284 # 0x0504
              comment: The metadata account does not exist, or already exists when creating a program.
            - name: relationship_meta_acc
              tag-value: 1540 # 0x0604
              comment: The metadata account is not owned by the program manager.
            - name: state_meta_acc
              tag-value: 1796 # 0x0704
              comment: The program is finalized, or is not in the state this instruction requires.
            - name: not_writable_meta_acc
              tag-value: 2052 # 0x0804
              comment: The metadata account is not writable in this transaction.
            - name: index_program_acc
              tag-value: 1029 # 0x0405
              comment: The program account index is outside the account list of the transaction.
            - name: na_program_acc
              tag-value: 1285 # 0x0505
              comment: The program account does not exist, or already exists when creating a program.
            - name: relationship_program_acc
              tag-value: 1541 # 0x0605
              comment: The program account is not owned by the program manager, or is not the program of this metadata account.
            - name: not_writable_program_acc
              tag-value: 2053 # 0x0805
              comment: The program account is not writable in this transaction.
            - name: authorization_authority_acc
              tag-value: 774 # 0x0306
              comment: The authority account did not authorize this transaction.
            - name: authorization_authority_candidate_acc
              tag-value: 775 # 0x0307
              comment: The proposed new authority did not authorize this transaction.
