abi:
  package: thru.program.faucet
  name: Faucet
  abi-version: 1
  package-version: 2.0.0
  description: >-
    Permissionless test-native-THRU faucet. The vault is the persistent PDA
    derived under this program with ASCII vault padded to 32 bytes. It has
    no account data. Initialize creates it and transfers a positive amount
    from transaction fee payer index zero atomically; it rejects existing
    vaults. Deposit is an explicit top-up; it also enables native receipt on
    a vault created before Initialize did. Withdraw (tag 1) transfers up to
    10000 base units to an existing recipient. Hosted clients authenticate
    through Developers; direct calls remain permissionless. Not a production
    treasury.
  options:
    program-metadata:
      root-types:
        instruction-root: FaucetInstruction
        errors: FaucetError
types:
  - name: DepositArgs
    kind:
      struct:
        packed: true
        display-name: Deposit to faucet
        fields:
          - name: faucet_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: faucet_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(faucet_account_idx)'
            display-name: Faucet vault
            user-display: true
          - name: depositor_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: depositor
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(depositor_account_idx)'
            display-name: Depositor
            user-display: true
          - name: eoa_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
          - name: amount_thru
            display-name: Amount
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Decimal } }
            expression: 'toDecimal(amount, 9)'
          - name: summary
            display-name: Summary
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Text } }
            expression: '`Deposit ${amount_thru} THRU to ${faucet_vault}`'
  - name: WithdrawArgs
    kind:
      struct:
        packed: true
        display-name: Withdraw from faucet
        fields:
          - name: faucet_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: faucet_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(faucet_account_idx)'
            display-name: Faucet vault
            user-display: true
          - name: recipient_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: recipient
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(recipient_account_idx)'
            display-name: Recipient
            user-display: true
          - name: amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
          - name: amount_thru
            display-name: Amount
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Decimal } }
            expression: 'toDecimal(amount, 9)'
          - name: summary
            display-name: Summary
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Text } }
            expression: '`Withdraw ${amount_thru} THRU to ${recipient}`'
  - name: InitializeArgs
    kind:
      struct:
        packed: true
        display-name: Create faucet
        fields:
          - name: faucet_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: faucet_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(faucet_account_idx)'
            display-name: Faucet vault
            user-display: true
          - name: eoa_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: funded_by
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(0)'
            display-name: Funded by
            user-display: true
          - name: amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
          - name: amount_thru
            display-name: Amount
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Decimal } }
            expression: 'toDecimal(amount, 9)'
          - name: summary
            display-name: Summary
            user-display: true
            type: synthetic
            return-type: { type-ref: { name: Text } }
            expression: '`Fund faucet ${faucet_vault} with ${amount_thru} THRU`'
          - name: proof_size
            user-display: false
            field-type: { primitive: u64 }
          - name: proof
            user-display: false
            field-type:
              array:
                size: { field-ref: { path: [proof_size] } }
                element-type: { primitive: u8 }
  - name: FaucetInstruction
    kind:
      struct:
        packed: true
        fields:
          - name: tag
            user-display: false
            field-type: { primitive: u32 }
          - name: payload
            field-type:
              enum:
                packed: true
                tag-ref: { field-ref: { path: [tag] } }
                variants:
                  - name: deposit
                    tag-value: 0
                    variant-type: { type-ref: { name: DepositArgs } }
                  - name: withdraw
                    tag-value: 1
                    variant-type: { type-ref: { name: WithdrawArgs } }
                  - name: initialize
                    tag-value: 2
                    variant-type: { type-ref: { name: InitializeArgs } }
  - name: FaucetError
    kind:
      struct:
        packed: true
        fields:
          - name: code
            field-type: { primitive: u64 }
          - name: error
            field-type:
              enum:
                tag-ref: { field-ref: { path: [code] } }
                variants:
                  - name: invalid_input
                    tag-value: 1
                    comment: An account index, account or amount in the instruction is not valid.
                  - name: transfer_failed
                    tag-value: 2
                    comment: The transfer could not be completed.
                  - name: create_failed
                    tag-value: 3
                    comment: The faucet account could not be created.
