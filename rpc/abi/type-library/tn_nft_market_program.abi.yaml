abi:
  package: thru.program.nft_market
  name: "NFT Market Program"
  abi-version: 1
  package-version: 0.2.0
  description: Peer-to-peer NFT trading via resting bid/ask orders with configurable marketplace fees
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
    # state_proof
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: NftMarketInstruction
        account-root: NftMarketProgramAccount
        errors: NftMarketError
        events: NftMarketEvent
types:
# ============================================================================
# Shared types
# ============================================================================
- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8
# ============================================================================
# Account structures
# ============================================================================
# Config account payload (66 bytes packed, 67 with the discriminator)
- name: NftMarketConfig
  kind:
    struct:
      packed: true
      fields:
      - name: admin
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: fee_recipient
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: fee_bps
        field-type:
          primitive: u16
# Order account payload (145 bytes packed, 146 with the discriminator; same
# struct for bid and ask)
- name: NftMarketOrder
  kind:
    struct:
      packed: true
      fields:
      - name: side
        field-type:
          primitive: u8
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: token_mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: maker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: vault
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64
      - name: expiry_time_ns
        field-type:
          primitive: u64
# ============================================================================
# Account root
# ============================================================================
# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
- name: NftMarketProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: config_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: NftMarketConfig
            - name: order_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: NftMarketOrder
# ============================================================================
# Instruction argument structures
# ============================================================================
- name: InitializeConfigArgs
  kind:
    struct:
      packed: true
      fields:
      - name: config_account_idx
        field-type:
          primitive: u16
      - name: fee_recipient
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: fee_bps
        field-type:
          primitive: u16
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
- name: UpdateConfigArgs
  kind:
    struct:
      packed: true
      fields:
      - name: config_account_idx
        field-type:
          primitive: u16
      - name: new_admin
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: new_fee_recipient
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: new_fee_bps
        field-type:
          primitive: u16
- name: PlaceBidArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: maker_account_idx
        field-type:
          primitive: u16
      - name: maker_token_account_idx
        field-type:
          primitive: u16
      - name: vault_account_idx
        field-type:
          primitive: u16
      - name: token_program_idx
        field-type:
          primitive: u16
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: token_mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64
      - name: expiry_time_ns
        field-type:
          primitive: u64
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
- name: PlaceAskArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: nft_account_idx
        field-type:
          primitive: u16
      - name: nft_mint_account_idx
        field-type:
          primitive: u16
      - name: nft_program_idx
        field-type:
          primitive: u16
      - name: token_mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64
      - name: expiry_time_ns
        field-type:
          primitive: u64
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
- name: ModifyBidArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: maker_account_idx
        field-type:
          primitive: u16
      - name: maker_token_account_idx
        field-type:
          primitive: u16
      - name: vault_account_idx
        field-type:
          primitive: u16
      - name: token_program_idx
        field-type:
          primitive: u16
      - name: new_amount
        field-type:
          primitive: u64
      - name: new_expiry_time_ns
        field-type:
          primitive: u64
- name: ModifyAskArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: new_amount
        field-type:
          primitive: u64
      - name: new_expiry_time_ns
        field-type:
          primitive: u64
- name: FillBidArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: config_account_idx
        field-type:
          primitive: u16
      - name: nft_account_idx
        field-type:
          primitive: u16
      - name: nft_mint_account_idx
        field-type:
          primitive: u16
      - name: nft_program_idx
        field-type:
          primitive: u16
      - name: maker_account_idx
        field-type:
          primitive: u16
      - name: vault_account_idx
        field-type:
          primitive: u16
      - name: taker_token_account_idx
        field-type:
          primitive: u16
      - name: fee_recipient_account_idx
        field-type:
          primitive: u16
      - name: token_program_idx
        field-type:
          primitive: u16
- name: FillAskArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: config_account_idx
        field-type:
          primitive: u16
      - name: nft_account_idx
        field-type:
          primitive: u16
      - name: nft_mint_account_idx
        field-type:
          primitive: u16
      - name: nft_program_idx
        field-type:
          primitive: u16
      - name: taker_nft_dest_idx
        field-type:
          primitive: u16
      - name: taker_token_account_idx
        field-type:
          primitive: u16
      - name: maker_token_account_idx
        field-type:
          primitive: u16
      - name: fee_recipient_account_idx
        field-type:
          primitive: u16
      - name: token_program_idx
        field-type:
          primitive: u16
- name: CancelBidArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: maker_account_idx
        field-type:
          primitive: u16
      - name: vault_account_idx
        field-type:
          primitive: u16
      - name: maker_token_account_idx
        field-type:
          primitive: u16
      - name: token_program_idx
        field-type:
          primitive: u16
- name: CancelAskArgs
  kind:
    struct:
      packed: true
      fields:
      - name: order_account_idx
        field-type:
          primitive: u16
      - name: nft_account_idx
        field-type:
          primitive: u16
      - name: nft_mint_account_idx
        field-type:
          primitive: u16
      - name: nft_program_idx
        field-type:
          primitive: u16
      - name: maker_dest_account_idx
        field-type:
          primitive: u16
# ============================================================================
# Instruction root (discriminant + enum payload)
# ============================================================================
- name: NftMarketInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: discriminant
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - discriminant
            variants:
            - name: initialize_config
              tag-value: 0
              variant-type:
                type-ref:
                  name: InitializeConfigArgs
            - name: update_config
              tag-value: 1
              variant-type:
                type-ref:
                  name: UpdateConfigArgs
            - name: place_bid
              tag-value: 2
              variant-type:
                type-ref:
                  name: PlaceBidArgs
            - name: place_ask
              tag-value: 3
              variant-type:
                type-ref:
                  name: PlaceAskArgs
            - name: modify_bid
              tag-value: 4
              variant-type:
                type-ref:
                  name: ModifyBidArgs
            - name: modify_ask
              tag-value: 5
              variant-type:
                type-ref:
                  name: ModifyAskArgs
            - name: fill_bid
              tag-value: 6
              variant-type:
                type-ref:
                  name: FillBidArgs
            - name: fill_ask
              tag-value: 7
              variant-type:
                type-ref:
                  name: FillAskArgs
            - name: cancel_bid
              tag-value: 8
              variant-type:
                type-ref:
                  name: CancelBidArgs
            - name: cancel_ask
              tag-value: 9
              variant-type:
                type-ref:
                  name: CancelAskArgs
# ============================================================================
# Event data structures
# ============================================================================
- name: OrderPlacedEventData
  kind:
    struct:
      packed: true
      fields:
      - name: side
        field-type:
          primitive: u8
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: token_mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: maker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64
      - name: expiry_time_ns
        field-type:
          primitive: u64
- name: OrderModifiedEventData
  kind:
    struct:
      packed: true
      fields:
      - name: side
        field-type:
          primitive: u8
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: maker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: old_amount
        field-type:
          primitive: u64
      - name: new_amount
        field-type:
          primitive: u64
      - name: new_expiry_time_ns
        field-type:
          primitive: u64
- name: OrderFilledEventData
  kind:
    struct:
      packed: true
      fields:
      - name: side
        field-type:
          primitive: u8
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: token_mint
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: maker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: taker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64
      - name: fee
        field-type:
          primitive: u64
- name: OrderCancelledEventData
  kind:
    struct:
      packed: true
      fields:
      - name: side
        field-type:
          primitive: u8
      - name: nft_pubkey
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: maker
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
- name: ConfigUpdatedEventData
  kind:
    struct:
      packed: true
      fields:
      - name: admin
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: fee_recipient
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: fee_bps
        field-type:
          primitive: u16
# ============================================================================
# Event root (event_type tag + enum payload)
# ============================================================================
- name: NftMarketEvent
  kind:
    struct:
      packed: true
      fields:
      - name: event_type
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - event_type
            variants:
            - name: order_placed
              tag-value: 0
              variant-type:
                type-ref:
                  name: OrderPlacedEventData
            - name: order_modified
              tag-value: 1
              variant-type:
                type-ref:
                  name: OrderModifiedEventData
            - name: order_filled
              tag-value: 2
              variant-type:
                type-ref:
                  name: OrderFilledEventData
            - name: order_cancelled
              tag-value: 3
              variant-type:
                type-ref:
                  name: OrderCancelledEventData
            - name: config_updated
              tag-value: 4
              variant-type:
                type-ref:
                  name: ConfigUpdatedEventData
- name: NftMarketError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction
              tag-value: 1
              comment: Instruction data is malformed, the wrong size, or not a known NFT market instruction.
            - name: invalid_account
              tag-value: 2
              comment: An account index is out of range, or an account is not the kind of account this instruction expects.
            - name: unauthorized
              tag-value: 3
              comment: The required signer, such as the order maker or the market admin, did not authorize this transaction.
            - name: invalid_amount
              tag-value: 4
              comment: The order amount is zero.
            - name: invalid_seed
              tag-value: 5
              comment: The order account seed does not match the NFT and the maker.
            - name: order_expired
              tag-value: 6
              comment: The order has expired.
            - name: invalid_side
              tag-value: 7
              comment: The order is a bid where an ask is expected, or an ask where a bid is expected.
            - name: invalid_fee_bps
              tag-value: 8
              comment: The marketplace fee is above the 50 percent maximum.
            - name: cpi_failed
              tag-value: 9
              comment: A call to the token program or the NFT program failed.
            - name: fee_overflow
              tag-value: 10
              comment: The marketplace fee on this amount is too large to compute.
            - name: vault_mismatch
              tag-value: 11
              comment: The vault account is not the vault of this order.
            - name: maker_mismatch
              tag-value: 12
              comment: The maker account is not the maker of this order.
            - name: nft_mismatch
              tag-value: 13
              comment: The NFT account is not the NFT of this order.
            - name: invalid_token_program
              tag-value: 14
              comment: The token program account is not the official token program.
            - name: invalid_nft_program
              tag-value: 15
              comment: The NFT program account is not the official NFT program.
