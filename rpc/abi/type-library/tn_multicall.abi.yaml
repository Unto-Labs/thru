abi:
  package: thru.program.multicall
  name: "Multicall"
  abi-version: 1
  package-version: 1.0.0
  description: ABI for the Thru multicall program instruction payload
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "MulticallArgs"
        errors: "MulticallError"

types:
- name: MulticallArgs
  kind:
    struct:
      packed: true
      display-name: Multicall
      fields:
      - name: calls_count
        display-name: Calls
        field-type:
          primitive: u16
      - name: calls
        user-display: false
        field-type:
          array:
            jagged: true
            size:
              field-ref:
                path: ["calls_count"]
            element-type:
              type-ref:
                name: InstructionData
                package: "thru.common.primitives"

- name: MulticallError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction_data_size
              tag-value: 1
              comment: Instruction data is too short or does not match the calls it lists.
            - name: invoke_failed
              tag-value: 2
              comment: One of the calls failed.
