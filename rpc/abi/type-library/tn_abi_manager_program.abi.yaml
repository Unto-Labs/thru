abi:
  package: thru.program.abi_manager
  name: "ABI Manager"
  abi-version: 1
  package-version: 0.2.0
  description: ABI for the Thru ABI manager program instructions and account state.
    Manages official ABIs under Public per-program authority or current Core governance,
    and external publisher-gated ABIs. Core YAML mutations commit exact source bytes.
  imports:
    - type: path
      path: thru_primitives.abi.yaml
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "AbiManagerInstruction"
        account-root: "AbiManagerProgramAccount"
        errors: "AbiManagerError"

types:
# ── Shared helper types ──

- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8

# ABI manager errors use a composite u16. The low byte is the reason and the
# high byte is the affected component.
- name: AbiManagerError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u16

# ── ABI Meta Account types ──

# Official meta body: references the program whose authority controls the ABI
- name: AbiMetaBodyOfficial
  kind:
    struct:
      packed: true
      fields:
      - name: program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

# External meta body: a publisher creates an ABI for a target program with a seed
- name: AbiMetaBodyExternal
  kind:
    struct:
      packed: true
      fields:
      - name: publisher
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: target_program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: seed
        field-type:
          type-ref:
            name: Seed32

# Union of official/external bodies (C union: size = max(32, 96) = 96 bytes)
- name: AbiMetaBody
  kind:
    union:
      packed: true
      variants:
      - name: official
        variant-type:
          type-ref:
            name: AbiMetaBodyOfficial
      - name: external
        variant-type:
          type-ref:
            name: AbiMetaBodyExternal

# Account root. Byte 0 of every account this program owns is account_type.
# Values are never reused; a new layout takes the next unused value.
- name: AbiManagerProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: meta_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: AbiMetaAccount
            - name: content_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: AbiAccount

# ABI meta payload (99 bytes after account_type; 100-byte account). The kind
# field selects the body: 0x00 = official, 0x01 = external.
- name: AbiMetaAccount
  kind:
    struct:
      packed: true
      fields:
      - name: kind
        field-type:
          primitive: u8
      - name: flags
        field-type:
          primitive: u16
      - name: body
        field-type:
          type-ref:
            name: AbiMetaBody

# ── ABI Content Account ──

# Stores the actual ABI blob, linked to an ABI meta account. Payload after
# account_type (45-byte header, then content_sz bytes of contents).
- name: AbiAccount
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_acc
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: revision
        field-type:
          primitive: u64
      - name: state
        field-type:
          primitive: u8
      - name: content_sz
        field-type:
          primitive: u32
      - name: contents
        field-type:
          array:
            size:
              field-ref:
                path: ["content_sz"]
            element-type:
              primitive: u8

# ── Instruction argument types ──

# CREATE_META_OFFICIAL_PERMANENT (0x00): creates a permanent official meta account
- name: CreateMetaOfficialPermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# CREATE_META_OFFICIAL_EPHEMERAL (0x01): creates an ephemeral official meta account
- name: CreateMetaOfficialEphemeralArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16

# CREATE_META_EXTERNAL_PERMANENT (0x02): creates a permanent external meta account
- name: CreateMetaExternalPermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: target_program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# CREATE_META_EXTERNAL_EPHEMERAL (0x03): creates an ephemeral external meta account
- name: CreateMetaExternalEphemeralArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: target_program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: seed
        field-type:
          type-ref:
            name: Seed32

# CREATE_ABI_OFFICIAL_PERMANENT (0x04): creates a permanent official ABI content account
- name: CreateAbiOfficialPermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # official Public-wire contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# CREATE_ABI_OFFICIAL_EPHEMERAL (0x05): creates an ephemeral official ABI content account
- name: CreateAbiOfficialEphemeralArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # official Public-wire contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16

# CREATE_ABI_EXTERNAL_PERMANENT (0x06): creates a permanent external ABI content account
- name: CreateAbiExternalPermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # the external ABI contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# CREATE_ABI_EXTERNAL_EPHEMERAL (0x07): creates an ephemeral external ABI content account
- name: CreateAbiExternalEphemeralArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # the external ABI contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16

# UPGRADE_ABI_OFFICIAL (0x08): replaces content in an official ABI account
- name: UpgradeAbiOfficialArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # official Public-wire contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16

# UPGRADE_ABI_EXTERNAL (0x09): replaces content in an external ABI account
- name: UpgradeAbiExternalArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        field-type:
          primitive: u16
      - name: srcbuf_offset
        field-type:
          primitive: u32
      - name: srcbuf_size
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # the external ABI contents must match it.
      - name: srcbuf_sha256
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        field-type:
          primitive: u16

# CLOSE_ABI_OFFICIAL (0x0A): deletes an official ABI content account
- name: CloseAbiOfficialArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16

# CLOSE_ABI_EXTERNAL (0x0B): deletes an external ABI content account
- name: CloseAbiExternalArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16

# FINALIZE_ABI_OFFICIAL (0x0C): marks an official ABI account as immutable
- name: FinalizeAbiOfficialArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: program_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16

# FINALIZE_ABI_EXTERNAL (0x0D): marks an external ABI account as immutable
- name: FinalizeAbiExternalArgs
  kind:
    struct:
      packed: true
      fields:
      - name: abi_meta_account_idx
        field-type:
          primitive: u16
      - name: abi_account_idx
        field-type:
          primitive: u16
      - name: authority_account_idx
        field-type:
          primitive: u16

# Core-only envelope: seven bound accounts (238 bytes), source range (8),
# exact YAML SHA-256 (32). Unused operands must be zero. Root correction has
# no manager metadata; create-meta has no content/source; close/finalize
# have no source. Existing index-only official operations remain Public-only.
- name: AbiBoundAccount
  kind:
    struct:
      packed: true
      fields:
      - name: index
        field-type:
          primitive: u16
      - name: address
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

- name: GovernedAbiArgs
  kind:
    struct:
      packed: true
      fields:
      - name: config
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: admin
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: subject
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: program_metadata
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: abi_metadata
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: abi_content
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: source
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: source_offset
        field-type:
          primitive: u32
      - name: source_size
        field-type:
          primitive: u32
      - name: content_sha256
        field-type:
          type-ref:
            name: Seed32

- name: GovernedAbiCreatePermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: governed
        field-type:
          type-ref:
            name: GovernedAbiArgs
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# ── Instruction envelope ──

- name: AbiManagerInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: discriminant
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - discriminant
            variants:
            - name: create_meta_official_permanent
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreateMetaOfficialPermanentArgs
            - name: create_meta_official_ephemeral
              tag-value: 1
              variant-type:
                type-ref:
                  name: CreateMetaOfficialEphemeralArgs
            - name: create_meta_external_permanent
              tag-value: 2
              variant-type:
                type-ref:
                  name: CreateMetaExternalPermanentArgs
            - name: create_meta_external_ephemeral
              tag-value: 3
              variant-type:
                type-ref:
                  name: CreateMetaExternalEphemeralArgs
            - name: create_abi_official_permanent
              tag-value: 4
              variant-type:
                type-ref:
                  name: CreateAbiOfficialPermanentArgs
            - name: create_abi_official_ephemeral
              tag-value: 5
              variant-type:
                type-ref:
                  name: CreateAbiOfficialEphemeralArgs
            - name: create_abi_external_permanent
              tag-value: 6
              variant-type:
                type-ref:
                  name: CreateAbiExternalPermanentArgs
            - name: create_abi_external_ephemeral
              tag-value: 7
              variant-type:
                type-ref:
                  name: CreateAbiExternalEphemeralArgs
            - name: upgrade_abi_official
              tag-value: 8
              variant-type:
                type-ref:
                  name: UpgradeAbiOfficialArgs
            - name: upgrade_abi_external
              tag-value: 9
              variant-type:
                type-ref:
                  name: UpgradeAbiExternalArgs
            - name: close_abi_official
              tag-value: 10
              variant-type:
                type-ref:
                  name: CloseAbiOfficialArgs
            - name: close_abi_external
              tag-value: 11
              variant-type:
                type-ref:
                  name: CloseAbiExternalArgs
            - name: finalize_abi_official
              tag-value: 12
              variant-type:
                type-ref:
                  name: FinalizeAbiOfficialArgs
            - name: finalize_abi_external
              tag-value: 13
              variant-type:
                type-ref:
                  name: FinalizeAbiExternalArgs
            - name: upgrade_root_official_abi
              tag-value: 14
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_create_meta_permanent
              tag-value: 15
              variant-type:
                type-ref:
                  name: GovernedAbiCreatePermanentArgs
            - name: core_create_meta_ephemeral
              tag-value: 16
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_create_content_permanent
              tag-value: 17
              variant-type:
                type-ref:
                  name: GovernedAbiCreatePermanentArgs
            - name: core_create_content_ephemeral
              tag-value: 18
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_upgrade
              tag-value: 19
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_close
              tag-value: 20
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_finalize
              tag-value: 21
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
