abi:
  package: thru.program.abi_manager
  name: "ABI Manager"
  abi-version: 1
  package-version: 0.2.0
  description: ABI for the Thru ABI manager program instructions and account state.
    Manages official ABIs under Public per-program authority or current Core governance,
    and external publisher-gated ABIs. Core YAML mutations commit exact source bytes.
  imports:
    - type: path
      path: thru_primitives.abi.yaml
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "AbiManagerInstruction"
        account-root: "AbiManagerProgramAccount"
        errors: "AbiManagerError"

types:
# ── Shared helper types ──

- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8

# ABI manager errors use a composite u16. The low byte is the reason and the
# high byte is the affected component.
- name: AbiManagerError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u16
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_account_idx
              tag-value: 1 # 0x0001
              comment: An account index in the instruction is outside the account list of the transaction.
            - name: account_not_found
              tag-value: 2 # 0x0002
              comment: A required account does not exist.
            - name: account_not_writable
              tag-value: 3 # 0x0003
              comment: The ABI account is not writable in this transaction.
            - name: invalid_size
              tag-value: 4 # 0x0004
              comment: The ABI account is not a valid ABI content account.
            - name: invalid_owner
              tag-value: 5 # 0x0005
              comment: An account has the wrong owner.
            - name: invalid_authority
              tag-value: 6 # 0x0006
              comment: The authority did not sign, or is not the authority allowed to manage this ABI.
            - name: invalid_state
              tag-value: 7 # 0x0007
              comment: The ABI is finalized, or an account is not in the state this instruction requires.
            - name: invalid_instruction
              tag-value: 256 # 0x0100
              comment: Instruction data is too short, is not a known instruction, or carries arguments this instruction does not accept.
            - name: instruction_invalid_size
              tag-value: 260 # 0x0104
              comment: Instruction data is too short or the wrong size for this instruction.
            - name: invalid_program_meta
              tag-value: 512 # 0x0200
              comment: The program metadata account is not valid, or does not match the program this ABI belongs to.
            - name: program_meta_account_not_found
              tag-value: 514 # 0x0202
              comment: The program metadata account does not exist.
            - name: program_meta_invalid_owner
              tag-value: 517 # 0x0205
              comment: The program metadata account is not owned by a program manager.
            - name: program_meta_invalid_authority
              tag-value: 518 # 0x0206
              comment: The signer is not the authority of the program.
            - name: invalid_abi_account
              tag-value: 768 # 0x0300
              comment: The ABI account is not the ABI account that belongs to this ABI metadata account.
            - name: abi_account_invalid_account_idx
              tag-value: 769 # 0x0301
              comment: The ABI account index is outside the account list of the transaction.
            - name: abi_account_account_not_writable
              tag-value: 771 # 0x0303
              comment: The ABI account to create is not writable in this transaction.
            - name: abi_account_account_already_exists
              tag-value: 776 # 0x0308
              comment: The ABI account to create already exists.
            - name: invalid_srcbuf
              tag-value: 1024 # 0x0400
              comment: The source buffer account is missing from the instruction or is the ABI account itself.
            - name: srcbuf_invalid_account_idx
              tag-value: 1025 # 0x0401
              comment: The source buffer account index is outside the account list of the transaction.
            - name: srcbuf_account_not_found
              tag-value: 1026 # 0x0402
              comment: The source buffer account does not exist.
            - name: srcbuf_invalid_size
              tag-value: 1028 # 0x0404
              comment: The source range goes past the end of the source buffer account.
            - name: srcbuf_invalid_state
              tag-value: 1031 # 0x0407
              comment: The source buffer account is compressed or deleted, or its contents do not match the hash in the instruction.
            - name: invalid_abi_meta
              tag-value: 1280 # 0x0500
              comment: The ABI metadata account is malformed, is at the wrong address, or does not match this ABI.
            - name: abi_meta_invalid_account_idx
              tag-value: 1281 # 0x0501
              comment: The ABI metadata account index is outside the account list of the transaction.
            - name: abi_meta_account_not_writable
              tag-value: 1283 # 0x0503
              comment: The ABI metadata account to create is not writable in this transaction.
            - name: abi_meta_account_already_exists
              tag-value: 1288 # 0x0508
              comment: The ABI metadata account to create already exists.
            - name: invalid_abi_meta_kind
              tag-value: 1536 # 0x0600
              comment: The ABI metadata account is of the wrong kind for this instruction.

# ── ABI Meta Account types ──

# Official meta body: references the program whose authority controls the ABI
- name: AbiMetaBodyOfficial
  kind:
    struct:
      packed: true
      fields:
      - name: program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

# External meta body: a publisher creates an ABI for a target program with a seed
- name: AbiMetaBodyExternal
  kind:
    struct:
      packed: true
      fields:
      - name: publisher
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: target_program
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: seed
        field-type:
          type-ref:
            name: Seed32

# Union of official/external bodies (C union: size = max(32, 96) = 96 bytes)
- name: AbiMetaBody
  kind:
    union:
      packed: true
      variants:
      - name: official
        variant-type:
          type-ref:
            name: AbiMetaBodyOfficial
      - name: external
        variant-type:
          type-ref:
            name: AbiMetaBodyExternal

# Account root. Byte 0 of every account this program owns is account_type.
# Values are never reused; a new layout takes the next unused value.
- name: AbiManagerProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: meta_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: AbiMetaAccount
            - name: content_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: AbiAccount

# ABI meta payload (99 bytes after account_type; 100-byte account). The kind
# field selects the body: 0x00 = official, 0x01 = external.
- name: AbiMetaAccount
  kind:
    struct:
      packed: true
      display-name: ABI metadata
      fields:
      - name: kind_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if kind == 0 { "Official" } else if kind == 1 { "External" } else { `Unknown (${kind})` }'
        display-name: Kind
        user-display: true
      - name: kind
        user-display: false
        field-type:
          primitive: u8
      - name: flags
        user-display: false
        field-type:
          primitive: u16
      - name: body
        user-display: false
        field-type:
          type-ref:
            name: AbiMetaBody

# ── ABI Content Account ──

# Stores the actual ABI blob, linked to an ABI meta account. Payload after
# account_type (45-byte header, then content_sz bytes of contents).
- name: AbiAccount
  kind:
    struct:
      packed: true
      display-name: ABI
      fields:
      - name: abi_meta_acc
        display-name: ABI metadata
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: revision
        display-name: Revision
        field-type:
          primitive: u64
      - name: state
        user-display: false
        field-type:
          primitive: u8
      - name: state_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if state == 0 { "Open" } else if state == 1 { "Finalized" } else { `Unknown (${state})` }'
        display-name: State
        user-display: true
      - name: content_sz
        display-name: Size (bytes)
        field-type:
          primitive: u32
      - name: contents
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path: ["content_sz"]
            element-type:
              primitive: u8

