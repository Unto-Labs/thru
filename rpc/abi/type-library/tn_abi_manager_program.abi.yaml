      - name: abi_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(abi_account_idx)'
        display-name: ABI
        user-display: true
      - name: abi_meta_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(abi_meta_account_idx)'
        display-name: ABI metadata
        user-display: true
      - name: publisher_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(authority_account_idx)'
        display-name: Publisher
        user-display: true
      - name: source_buffer
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(srcbuf_account_idx)'
        display-name: Source buffer
        user-display: true
      - name: abi_meta_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: abi_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: srcbuf_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: srcbuf_offset
        user-display: false
        field-type:
          primitive: u32
      - name: srcbuf_size
        display-name: Size (bytes)
        field-type:
          primitive: u32
      # SHA-256 of exactly srcbuf[srcbuf_offset, srcbuf_offset + srcbuf_size);
      # the external ABI contents must match it.
      - name: srcbuf_sha256
        user-display: false
        field-type:
          type-ref:
            name: Seed32
      - name: authority_account_idx
        user-display: false
        field-type:
          primitive: u16

