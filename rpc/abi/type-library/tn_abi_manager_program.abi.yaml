# Core-only envelope: seven bound accounts (238 bytes), source range (8),
# exact YAML SHA-256 (32). Unused operands must be zero. Root correction has
# no manager metadata; create-meta has no content/source; close/finalize
# have no source. Existing index-only official operations remain Public-only.
- name: AbiBoundAccount
  kind:
    struct:
      packed: true
      fields:
      - name: index
        field-type:
          primitive: u16
      - name: address
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

- name: GovernedAbiArgs
  kind:
    struct:
      packed: true
      fields:
      - name: config
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: admin
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: subject
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: program_metadata
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: abi_metadata
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: abi_content
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: source
        field-type:
          type-ref:
            name: AbiBoundAccount
      - name: source_offset
        field-type:
          primitive: u32
      - name: source_size
        field-type:
          primitive: u32
      - name: content_sha256
        field-type:
          type-ref:
            name: Seed32

- name: GovernedAbiCreatePermanentArgs
  kind:
    struct:
      packed: true
      fields:
      - name: governed
        field-type:
          type-ref:
            name: GovernedAbiArgs
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# ── Instruction envelope ──

- name: AbiManagerInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: discriminant
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - discriminant
            variants:
            - name: create_meta_official_permanent
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreateMetaOfficialPermanentArgs
            - name: create_meta_official_ephemeral
              tag-value: 1
              variant-type:
                type-ref:
                  name: CreateMetaOfficialEphemeralArgs
            - name: create_meta_external_permanent
              tag-value: 2
              variant-type:
                type-ref:
                  name: CreateMetaExternalPermanentArgs
            - name: create_meta_external_ephemeral
              tag-value: 3
              variant-type:
                type-ref:
                  name: CreateMetaExternalEphemeralArgs
            - name: create_abi_official_permanent
              tag-value: 4
              variant-type:
                type-ref:
                  name: CreateAbiOfficialPermanentArgs
            - name: create_abi_official_ephemeral
              tag-value: 5
              variant-type:
                type-ref:
                  name: CreateAbiOfficialEphemeralArgs
            - name: create_abi_external_permanent
              tag-value: 6
              variant-type:
                type-ref:
                  name: CreateAbiExternalPermanentArgs
            - name: create_abi_external_ephemeral
              tag-value: 7
              variant-type:
                type-ref:
                  name: CreateAbiExternalEphemeralArgs
            - name: upgrade_abi_official
              tag-value: 8
              variant-type:
                type-ref:
                  name: UpgradeAbiOfficialArgs
            - name: upgrade_abi_external
              tag-value: 9
              variant-type:
                type-ref:
                  name: UpgradeAbiExternalArgs
            - name: close_abi_official
              tag-value: 10
              variant-type:
                type-ref:
                  name: CloseAbiOfficialArgs
            - name: close_abi_external
              tag-value: 11
              variant-type:
                type-ref:
                  name: CloseAbiExternalArgs
            - name: finalize_abi_official
              tag-value: 12
              variant-type:
                type-ref:
                  name: FinalizeAbiOfficialArgs
            - name: finalize_abi_external
              tag-value: 13
              variant-type:
                type-ref:
                  name: FinalizeAbiExternalArgs
            - name: upgrade_root_official_abi
              tag-value: 14
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_create_meta_permanent
              tag-value: 15
              variant-type:
                type-ref:
                  name: GovernedAbiCreatePermanentArgs
            - name: core_create_meta_ephemeral
              tag-value: 16
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_create_content_permanent
              tag-value: 17
              variant-type:
                type-ref:
                  name: GovernedAbiCreatePermanentArgs
            - name: core_create_content_ephemeral
              tag-value: 18
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_upgrade
              tag-value: 19
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_close
              tag-value: 20
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
            - name: core_finalize
              tag-value: 21
              variant-type:
                type-ref:
                  name: GovernedAbiArgs
