abi:
  package: thru.program.wallet
  name: "Wallet Program"
  abi-version: 1
  package-version: 0.2.0
  description: ABI for the Wallet Program instructions, account state,
    and events
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
    # state_proof
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "PasskeyInstruction"
        account-root: "WalletProgramAccount"
        errors: "PasskeyError"
        events: "PasskeyEvent"

types:
# ── Shared types ──

- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8

- name: P256Point
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8

# Authority: 65-byte tagged union
# tag=1 (passkey): pubkey_x[32] || pubkey_y[32]
# tag=2 (pubkey):  pubkey[32]   || padding[32]
- name: Authority
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        field-type:
          primitive: u8
      - name: data
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8

# AuthorityRecord: 73-byte wallet authority entry
- name: AuthorityRecord
  kind:
    struct:
      packed: true
      fields:
      - name: authority
        field-type:
          type-ref:
            name: Authority
      - name: expires_at_block_time_seconds
        field-type:
          primitive: u64

# ── Instruction argument types ──

# CREATE (tag 0x00): 107 bytes fixed + StateProof
- name: CreateArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: authority_record
        field-type:
          type-ref:
            name: AuthorityRecord
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# VALIDATE (tag 0x01): 71 bytes fixed + variable data + InstructionData
- name: ValidateArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: auth_idx
        field-type:
          primitive: u8
      - name: signature_r
        field-type:
          type-ref:
            name: P256Point
      - name: signature_s
        field-type:
          type-ref:
            name: P256Point
      - name: authenticator_data_len
        field-type:
          primitive: u16
      - name: client_data_len
        field-type:
          primitive: u16
      - name: authenticator_data
        field-type:
          array:
            size:
              field-ref:
                path: ["authenticator_data_len"]
            element-type:
              primitive: u8
      - name: client_data
        format: json
        field-type:
          array:
            size:
              field-ref:
                path: ["client_data_len"]
            element-type:
              primitive: u8
      - name: target_instruction
        field-type:
          type-ref:
            name: InstructionData
            package: "thru.common.primitives"

# TRANSFER (tag 0x02): 12 bytes fixed
- name: TransferArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: to_account_idx
        field-type:
          primitive: u16
      - name: amount
        field-type:
          primitive: u64

# ADD_AUTHORITY (tag 0x04): 75 bytes
- name: AddAuthorityArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: authority_record
        field-type:
          type-ref:
            name: AuthorityRecord

# REMOVE_AUTHORITY (tag 0x05): 3 bytes
- name: RemoveAuthorityArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: auth_idx
        field-type:
          primitive: u8

# REGISTER_CREDENTIAL (tag 0x06): 36 bytes fixed + StateProof
- name: RegisterCredentialArgs
  kind:
    struct:
      packed: true
      fields:
      - name: wallet_account_idx
        field-type:
          primitive: u16
      - name: lookup_account_idx
        field-type:
          primitive: u16
      - name: seed
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"

# ── Instruction envelope ──

- name: PasskeyInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - tag
            variants:
            - name: create
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreateArgs
            - name: validate
              tag-value: 1
              variant-type:
                type-ref:
                  name: ValidateArgs
            - name: transfer
              tag-value: 2
              variant-type:
                type-ref:
                  name: TransferArgs
            - name: add_authority
              tag-value: 4
              variant-type:
                type-ref:
                  name: AddAuthorityArgs
            - name: remove_authority
              tag-value: 5
              variant-type:
                type-ref:
                  name: RemoveAuthorityArgs
            - name: register_credential
              tag-value: 6
              variant-type:
                type-ref:
                  name: RegisterCredentialArgs

# ── Account state ──

# Account root: byte 0 of every Wallet Program account is account_type and the
# payload follows. One value per (account kind, layout); 0 is invalid, so a
# zeroed account never decodes. Values are never reused: a new layout or a new
# kind of account takes the next unused value.
- name: WalletProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: wallet_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: WalletAccount
            - name: credential_lookup_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: CredentialLookup

# Wallet payload: num_auth, nonce, then num_auth + 1 authority records.
- name: WalletAccount
  kind:
    struct:
      packed: true
      fields:
      - name: num_auth
        field-type:
          primitive: u8
      - name: nonce
        field-type:
          primitive: u64
      - name: authorities
        field-type:
          array:
            size:
              add:
                left:
                  field-ref:
                    path: ["num_auth"]
                right:
                  literal:
                    u64: 1
            element-type:
              type-ref:
                name: AuthorityRecord

# Credential lookup payload: the wallet a WebAuthn credential belongs to. The
# account address is a PDA seeded by SHA-256(credentialId).
- name: CredentialLookup
  kind:
    struct:
      packed: true
      fields:
      - name: wallet
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

# ── Events ──

- name: WalletCreatedEventData
  kind:
    struct:
      packed: true
      fields:
      - name: wallet
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: authority
        field-type:
          type-ref:
            name: Authority

- name: WalletValidatedEventData
  kind:
    struct:
      packed: true
      fields:
      - name: wallet
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: new_nonce
        field-type:
          primitive: u64

- name: WalletTransferEventData
  kind:
    struct:
      packed: true
      fields:
      - name: wallet
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: to
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: amount
        field-type:
          primitive: u64

- name: CredentialRegisteredEventData
  kind:
    struct:
      packed: true
      fields:
      - name: wallet
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: lookup
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"

- name: PasskeyEvent
  kind:
    struct:
      packed: true
      fields:
      - name: event_type
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - event_type
            variants:
            - name: wallet_created
              tag-value: 0
              variant-type:
                type-ref:
                  name: WalletCreatedEventData
            - name: wallet_validated
              tag-value: 1
              variant-type:
                type-ref:
                  name: WalletValidatedEventData
            - name: wallet_transfer
              tag-value: 2
              variant-type:
                type-ref:
                  name: WalletTransferEventData
            - name: credential_registered
              tag-value: 3
              variant-type:
                type-ref:
                  name: CredentialRegisteredEventData

# Matches #[repr(u64)] PasskeyError in programs/rust/examples/wallet/types.rs:
# 81 InvalidInstruction, 82 InvalidAccountIdx, 83 AccountNotFound,
# 84 AccountNotWritable, 85 InvalidSize, 86 InvalidOwner, 87 InvalidSignature,
# 88 NotValidated, 89 AccountAlreadyExists, 90 InvalidChallenge,
# 91 AuthorityExpired, 92 PasskeyRequired, 93 SessionExpiryTooLong.
- name: PasskeyError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
