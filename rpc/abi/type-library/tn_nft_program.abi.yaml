# ============================================================================
# UNIFIED ROOT TYPES
# ============================================================================
# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
- name: NftProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: mint_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: NftMintAccount
            - name: nft_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: NftAccount
- name: NftError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction
              tag-value: 1
              comment: Instruction data is malformed, the wrong size, or not a known NFT instruction.
            - name: invalid_account
              tag-value: 2
              comment: An account index is out of range, or an account is not the NFT or mint account this instruction expects.
            - name: mint_already_initialized
              tag-value: 3
              comment: The mint account is already set up.
            - name: unauthorized
              tag-value: 4
              comment: The mint authority, or the NFT owner where the NFT allows it, did not authorize this transaction.
            - name: max_supply_reached
              tag-value: 5
              comment: This mint cannot issue any more NFTs.
