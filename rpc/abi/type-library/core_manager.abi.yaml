abi:
  package: thru.program.core_manager
  name: Core Manager
  abi-version: 1
  package-version: 0.2.0
  description: Strict genesis-governed Core lifecycle manager. Account discriminators
    managed program metadata 1, config 2, proof slot 3; admin kinds EOA 1 and Multisig
    2; proof slot seeds start with coreprf1. Core A (0x..01) and Core B (the Core
    A-managed pair at seed thru-core-peer:v1) run this binary. Core A upgrades Core
    B with upgrade; Core B upgrades Core A, which its executable owns, with upgrade_peer.
    Admin rotation (propose_admin, accept_admin) runs on Core A and moves both configs
    in one instruction, Core A invoking Core B with the mirrored arguments (peer
    is Core B and its config; Core B sees Core A and Core A's config). Errors 4097 instruction, 4098 binding, 4099 config, 4100 admin, 4101
    authorization, 4102 account, 4103 state, 4104 protected, 4105 image, 4106 proof,
    4107 namespace. No transaction marker or public initialization.
  imports:
  - type: path
    path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: CoreInstruction
        account-root: CoreManagerAccount
        errors: CoreManagerError
types:
- name: BoundAccount
  kind:
    struct:
      packed: true
      fields:
      - name: index
        field-type:
          primitive: u16
      - name: address
        field-type: &id004
          type-ref:
            name: Pubkey
            package: thru.common.primitives
- name: ImageCommitment
  kind:
    struct:
      packed: true
      fields:
      - name: source
        field-type: &id002
          type-ref:
            name: BoundAccount
      - name: offset
        field-type: &id001
          primitive: u32
      - name: length
        field-type: *id001
      - name: sha256
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type: &id003
              primitive: u8
- name: CreateEphemeralArgs
  kind:
    struct:
      packed: true
      display-name: Create ephemeral program
      fields:
      - name: config
        user-display: false
        field-type: *id002
      - name: admin
        user-display: false
        field-type: *id002
      - name: metadata
        user-display: false
        field-type: *id002
      - name: program
        user-display: false
        field-type: *id002
      - name: program_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'program.address'
        display-name: Program
        user-display: true
      - name: metadata_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'metadata.address'
        display-name: Program metadata
        user-display: true
      - name: seed
        user-display: false
        field-type: &id005
          array:
            size:
              literal:
                u64: 32
            element-type: *id003
      - name: image
        user-display: false
        field-type: &id006
          type-ref:
            name: ImageCommitment
      - name: source_buffer
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'image.source.address'
        display-name: Source buffer
        user-display: true
      - name: program_size
        type: synthetic
        return-type: { primitive: u32 }
        expression: 'image.length'
        display-name: Program size (bytes)
        user-display: true
      - name: application_authority
        display-name: Application authority
        field-type: *id004
      - name: pin
        user-display: false
        field-type: *id003
      - name: pinned
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if pin == 1 { "Yes" } else if pin == 0 { "No" } else { `Invalid (${pin})` }'
        display-name: Pinned
        user-display: true
      - name: admin_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'admin.address'
        display-name: Admin
        user-display: true
      - name: config_address
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'config.address'
        display-name: Config
        user-display: true
