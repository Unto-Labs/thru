          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - tag
            variants:
            - name: create_permanent
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreatePermanentArgs
            - name: create_ephemeral
              tag-value: 1
              variant-type:
                type-ref:
                  name: CreateEphemeralArgs
            - name: upgrade
              tag-value: 2
              variant-type:
                type-ref:
                  name: UpgradeArgs
            - name: set_pause
              tag-value: 3
              variant-type:
                type-ref:
                  name: SetPauseArgs
            - name: destroy
              tag-value: 4
              variant-type:
                type-ref:
                  name: PairArgs
            - name: finalize
              tag-value: 5
              variant-type:
                type-ref:
                  name: PairArgs
            - name: set_application_authority
              tag-value: 6
              variant-type:
                type-ref:
                  name: SetApplicationAuthorityArgs
            - name: set_pin
              tag-value: 7
              variant-type:
                type-ref:
                  name: SetPinArgs
            - name: propose_admin
              tag-value: 8
              variant-type:
                type-ref:
                  name: ProposeAdminArgs
            - name: accept_admin
              tag-value: 9
              variant-type:
                type-ref:
                  name: AcceptAdminArgs
            - name: write_proof_slot
              tag-value: 10
              variant-type:
                type-ref:
                  name: WriteProofSlotArgs
            - name: upgrade_peer
              tag-value: 11
              variant-type:
                type-ref:
                  name: UpgradePeerArgs
# Account root. Byte 0 of every account Core owns (other than program code
# accounts, which stay raw) is account_type. Values are never reused; a new
# layout takes the next unused value. Managed program metadata has the same
# layout and value as the Public Manager's program metadata.
- name: CoreManagerAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: program_meta_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: ManagedProgramMetadata
            - name: config_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: CoreConfig
            - name: proof_slot_v1
              tag-value: 3
              variant-type:
                type-ref:
                  name: ProofSlot
# Config payload (71 bytes after account_type).
- name: CoreConfig
  kind:
    struct:
      packed: true
      display-name: Core config
      fields:
      - name: admin_kind
        user-display: false
        field-type: *id003
      - name: pending_admin_kind
        user-display: false
        field-type: *id003
      - name: pending_present
        user-display: false
        field-type: *id003
      - name: reserved
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 4
            element-type: *id003
      - name: admin
        display-name: Admin
        field-type: *id004
      - name: admin_kind_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if admin_kind == 1 { "EOA" } else if admin_kind == 2 { "Multisig" } else { `Unknown (${admin_kind})` }'
        display-name: Admin kind
        user-display: true
      - name: pending_admin
        user-display: false
        field-type: *id004
      - name: pending_admin_or_none
        type: synthetic
        return-type: { optional: { type-ref: { name: Pubkey } } }
        expression: 'if pending_present == 1 { pending_admin } else { none }'
        display-name: Pending admin
        user-display: true
      - name: pending_admin_kind_name
        type: synthetic
        return-type: { optional: { type-ref: { name: Text } } }
        expression: 'if pending_present == 1 { if pending_admin_kind == 1 { "EOA" } else if pending_admin_kind == 2 { "Multisig" } else { `Unknown (${pending_admin_kind})` } } else { none }'
        display-name: Pending admin kind
        user-display: true
# Managed program metadata payload (73 bytes after account_type).
- name: ManagedProgramMetadata
  kind:
    struct:
      packed: true
      display-name: Program metadata
      fields:
      - name: authority
        display-name: Application authority
        field-type: *id004
      - name: authority_candidate
        user-display: false
        field-type: *id004
      - name: version
        display-name: Version
        field-type: &id007
          primitive: u64
      - name: state
        user-display: false
        field-type: *id003
      - name: state_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if state == 0 { "Open" } else if state == 1 { "Paused" } else if state == 2 { "Finalized" } else { `Unknown (${state})` }'
        display-name: State
        user-display: true
# Proof slot payload (after account_type).
- name: ProofSlot
  kind:
    struct:
      packed: true
      display-name: Proof slot
      fields:
      - name: reserved
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 3
            element-type: *id003
      - name: metadata_proof_size
        display-name: Metadata proof size (bytes)
        field-type: *id001
      - name: program_proof_size
        display-name: Program proof size (bytes)
        field-type: *id001
      - name: metadata_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path:
                - metadata_proof_size
            element-type: *id003
      - name: program_proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path:
                - program_proof_size
            element-type: *id003
- name: CoreManagerError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type: *id007
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: instruction
              tag-value: 4097 # 0x1001
              comment: Instruction data is the wrong size, is not a known instruction, or has a field that is not allowed.
            - name: binding
              tag-value: 4098 # 0x1002
              comment: An account index and the address given for it do not match.
            - name: config
              tag-value: 4099 # 0x1003
              comment: The core config account is not valid.
            - name: admin
              tag-value: 4100 # 0x1004
              comment: The proposed admin account is not a valid admin.
            - name: authorization
              tag-value: 4101 # 0x1005
