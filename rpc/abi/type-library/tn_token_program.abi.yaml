        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(mint_account_index)'
        display-name: Mint
        user-display: true
      - name: amount
        user-display: false
        field-type:
          primitive: u64
      - name: decimals
        user-display: false
        field-type:
          primitive: u8
      - name: ticker
        user-display: false
        field-type:
          type-ref:
            name: TickerField
- name: MintToInstruction
  kind:
    struct:
      packed: true
      display-name: Mint tokens
      fields:
      - name: mint_account_index
        user-display: false
        field-type:
