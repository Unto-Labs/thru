abi:
  package: thru.program.token
  name: "Token Program"
  abi-version: 1
  package-version: 0.2.0
  description: Ideal ABI for the Thru token program instruction envelopes and account
    state
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
    # state_proof
    - type: path
      path: state_proof.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "TokenInstruction"
        account-root: "TokenProgramAccount"
        errors: "TokenError"
        events: "TokenEvent"
types:
- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8
- name: TickerField
  format: text
  kind:
    struct:
      packed: true
      fields:
      - name: length
        field-type:
          primitive: u8
      - name: bytes
        field-type:
          array:
            size:
              literal:
                u64: 8
            element-type:
              primitive: u8
- name: InitializeMintInstruction
  kind:
    struct:
      packed: true
      display-name: Create token mint
      fields:
      - name: mint_account_index
        user-display: false
        field-type:
          primitive: u16
      - name: mint
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(mint_account_index)'
        display-name: Mint
        user-display: true
      - name: decimals
        display-name: Decimals
        field-type:
          primitive: u8
      - name: creator
        user-display: false
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: mint_authority
        display-name: Mint authority
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: freeze_authority
        user-display: false
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: has_freeze_authority
        user-display: false
        field-type:
          primitive: u8
      - name: freeze_authority_or_none
        type: synthetic
        return-type: { optional: { type-ref: { name: Pubkey } } }
        expression: 'if has_freeze_authority != 0 { freeze_authority } else { none }'
        display-name: Freeze authority
        user-display: true
      - name: ticker
        display-name: Ticker
        field-type:
          type-ref:
            name: TickerField
      - name: seed
        user-display: false
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        user-display: false
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
- name: InitializeAccountInstruction
  kind:
    struct:
      packed: true
      display-name: Create token account
      fields:
      - name: token_account_index
        user-display: false
        field-type:
          primitive: u16
      - name: token_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(token_account_index)'
        display-name: Token account
        user-display: true
      - name: mint_account_index
        user-display: false
        field-type:
          primitive: u16
      - name: mint
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(mint_account_index)'
        display-name: Mint
        user-display: true
      - name: owner_account_index
        user-display: false
        field-type:
          primitive: u16
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(owner_account_index)'
        display-name: Owner
        user-display: true
      - name: new_account_seed
        user-display: false
        field-type:
          type-ref:
            name: Seed32
      - name: state_proof
        user-display: false
        field-type:
          type-ref:
            name: StateProof
            package: "thru.blockchain.state_proof"
- name: TransferInstruction
  kind:
    struct:
      packed: true
      display-name: Transfer tokens
      fields:
      - name: source_account_index
        user-display: false
        field-type:
