          primitive: u8
      - name: frozen
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if is_frozen != 0 { "Yes" } else { "No" }'
        display-name: Frozen
        user-display: true
# Account root: byte 0 of every token program account is account_type and
# the payload follows. One value per (account kind, layout); 0 is invalid, so
# a zeroed or closed account never decodes. Values are never reused: a new
# layout or a new kind of account takes the next unused value.
- name: TokenProgramAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: mint_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: TokenMintAccount
            - name: token_account_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: TokenAccount
