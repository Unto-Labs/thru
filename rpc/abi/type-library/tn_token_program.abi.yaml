# Matches #[repr(u64)] TokenError in programs/rust/examples/token_program/types.rs:
# 1 InvalidInstructionDataSize, 2 InvalidInstruction, 4 InsufficientFunds,
# 5 OwnerMismatch, 6 AuthorityMismatch, 7 MissingRequiredSigner, 8 AccountFrozen,
# 9 AccountNotOwnedByProgram, 10 InvalidMint, 11 NonZeroBalance,
# 12 InvalidAccountDataSize, 13 Overflow, 14 MintMismatch, 15 IncorrectProgramId,
# 16 InvalidTxn, 17 InvalidProof, 18 InvalidAccount, 19 MintCannotFreeze,
# 20 SyscallFailed, 21 DecimalsMismatch, 22 TickerMismatch, 23 InvalidTicker.
# Code 3 is not assigned and is never reused.
- name: TokenError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction_data_size
              tag-value: 1
              comment: Instruction data is too short or the wrong size for this instruction.
            - name: invalid_instruction
              tag-value: 2
              comment: Instruction tag is not a known token instruction.
            - name: insufficient_funds
              tag-value: 4
              comment: Source balance is lower than the amount to transfer or burn.
            - name: owner_mismatch
              tag-value: 5
              comment: Signing authority is not the owner of the token account.
            - name: authority_mismatch
              tag-value: 6
              comment: Signing authority is not the mint authority or freeze authority of the mint.
            - name: missing_required_signer
              tag-value: 7
              comment: Owner or authority of the account did not authorize this transaction.
            - name: account_frozen
              tag-value: 8
              comment: Token account is frozen.
            - name: account_not_owned_by_program
              tag-value: 9
              comment: Account is not owned by the token program.
            - name: invalid_mint
              tag-value: 10
              comment: Mint account is not valid.
            - name: non_zero_balance
              tag-value: 11
              comment: Token account still holds a balance and cannot be closed.
            - name: invalid_account_data_size
              tag-value: 12
              comment: Account data is not the size of a mint or token account.
            - name: overflow
              tag-value: 13
              comment: Amount is too large and would overflow the balance or supply.
            - name: mint_mismatch
              tag-value: 14
              comment: Token account belongs to a different mint.
            - name: incorrect_program_id
              tag-value: 15
              comment: Program id is not the token program.
            - name: invalid_txn
              tag-value: 16
              comment: Transaction is not valid for this instruction.
            - name: invalid_proof
              tag-value: 17
              comment: State proof in the instruction data is missing or malformed.
            - name: invalid_account
              tag-value: 18
              comment: Account index is out of range, or the account is not the expected mint or token account.
            - name: mint_cannot_freeze
              tag-value: 19
              comment: Mint has no freeze authority.
            - name: syscall_failed
              tag-value: 20
              comment: Token program could not create or update the account.
            - name: decimals_mismatch
              tag-value: 21
              comment: Mint decimals differ from the decimals the instruction expects.
            - name: ticker_mismatch
              tag-value: 22
              comment: Mint ticker differs from the ticker the instruction expects.
            - name: invalid_ticker
              tag-value: 23
              comment: Expected ticker is longer than 8 bytes or is not zero padded.
