abi:
  package: thru.program.oracle
  name: "Oracle Program"
  abi-version: 1
  package-version: 0.2.0
  description: ABI for the Thru oracle program instructions, feed accounts, events, and errors
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: "OracleInstruction"
        account-root: "OracleFeedAccount"
        errors: "OracleError"
        events: "OracleEvent"

types:
# ── Shared types ──

- name: Seed32
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 32
      element-type:
        primitive: u8

# Feed names are NUL-terminated UTF-8 stored in a fixed 64-byte field.
- name: FeedName64
  format: text
  kind:
    array:
      packed: true
      size:
        literal:
          u64: 64
      element-type:
        primitive: u8

# ── Create-feed instruction ──

# PRICE feed type-specific data (feed_type=1, type_specific_size=8).
- name: CreatePriceFeedData
  kind:
    struct:
      display-name: Price feed settings
      packed: true
      fields:
      - name: max_variance_bps
        user-display: false
        field-type:
          primitive: u32
      - name: max_variance
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: '`${toDecimal(max_variance_bps, 2)}%`'
        display-name: Max variance
        user-display: true
      - name: exponent
        display-name: Exponent
        field-type:
          primitive: i32

# BOOLEAN feed type-specific data (feed_type=2, type_specific_size=0).
- name: CreateBooleanFeedData
  kind:
    struct:
      display-name: Boolean feed settings
      packed: true
      fields: []

# Wire layout after the instruction discriminant:
# [fixed fields][type_specific payload selected by feed_type][proof bytes].
# proof_size and type_specific_size are carried as u64 values by the C program.
# The program additionally enforces type_specific_size=8 for PRICE and 0 for
# BOOLEAN and rejects a zero-length proof.
# SDK implementation note: generated TypeScript enum builders do not currently
# emit sibling flexible arrays that follow the enum. Until generic support lands:
# - hand-encode only the CREATE_FEED payload; generated helpers remain suitable
#   for the other oracle instructions
# - derive proof_size and type_specific_size rather than accepting caller values
# - preserve the packed little-endian fields and account-index ordering
# - reject empty proofs and roundtrip PRICE and BOOLEAN goldens through this ABI
- name: CreateFeedArgs
  kind:
    struct:
      display-name: Create feed
      packed: true
      fields:
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: max_staleness_ns
        display-name: Max staleness (ns)
        field-type:
          primitive: u64
      - name: proof_size
        user-display: false
        field-type:
          primitive: u64
      - name: type_specific_size
        user-display: false
        field-type:
          primitive: u64
      - name: admin_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: admin
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(admin_account_idx)'
        display-name: Admin
        user-display: true
      - name: reporter_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: reporter
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(reporter_account_idx)'
        display-name: Reporter
        user-display: true
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: feed_type
        user-display: false
        field-type:
          primitive: u8
      - name: feed_type_name
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if feed_type == 1 { "Price" } else { if feed_type == 2 { "Boolean" } else { `Unknown (${feed_type})` } }'
        display-name: Feed type
        user-display: true
      - name: feed_account_seed
        user-display: false
        field-type:
          type-ref:
            name: Seed32
      - name: feed_name
        display-name: Feed name
        field-type:
          type-ref:
            name: FeedName64
      - name: type_specific
        user-display: false
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - feed_type
            variants:
            - name: price
              tag-value: 1
              variant-type:
                type-ref:
                  name: CreatePriceFeedData
            - name: boolean
              tag-value: 2
              variant-type:
                type-ref:
                  name: CreateBooleanFeedData
      - name: proof
        user-display: false
        field-type:
          array:
            size:
              field-ref:
                path:
                - proof_size
            element-type:
              primitive: u8

# ── Update and administration instructions ──

- name: PostPriceUpdateArgs
  kind:
    struct:
      display-name: Post price update
      packed: true
      fields:
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: price
        display-name: Price (raw)
        field-type:
          primitive: u64
      - name: timestamp_ns
        display-name: Timestamp (ns)
        field-type:
          primitive: u64
      - name: time
        display-name: Time
        user-display: true
        type: synthetic
        return-type: { type-ref: { name: Timestamp } }
        expression: 'timestamp(timestamp_ns / 1000000000)'
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16

- name: PostBooleanUpdateArgs
  kind:
    struct:
      display-name: Post boolean update
      packed: true
      fields:
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: value
        display-name: Value
        field-type:
          primitive: u8
      - name: timestamp_ns
        display-name: Timestamp (ns)
        field-type:
          primitive: u64
      - name: time
        display-name: Time
        user-display: true
        type: synthetic
        return-type: { type-ref: { name: Timestamp } }
        expression: 'timestamp(timestamp_ns / 1000000000)'
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16

# POST_UPDATE has one top-level discriminant. The C program selects PRICE or
# BOOLEAN from the remaining payload size rather than from a second tag.
- name: PostUpdateArgs
  kind:
    struct:
      packed: true
      fields:
      - name: update
        field-type:
          size-discriminated-union:
            packed: true
            variants:
            - name: price
              expected-size: 18
              variant-type:
                type-ref:
                  name: PostPriceUpdateArgs
            - name: boolean
              expected-size: 11
              variant-type:
                type-ref:
                  name: PostBooleanUpdateArgs

- name: SetParamsArgs
  kind:
    struct:
      display-name: Set feed parameters
      packed: true
      fields:
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: max_staleness_ns
        display-name: Max staleness (ns)
        field-type:
          primitive: u64
      - name: max_variance_bps
        user-display: false
        field-type:
          primitive: u32
      - name: max_variance
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: '`${toDecimal(max_variance_bps, 2)}%`'
        display-name: Max variance (price feeds only)
        user-display: true
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16

- name: SetAdminArgs
  kind:
    struct:
      display-name: Set feed admin
      packed: true
      fields:
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: new_admin_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: new_admin
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(new_admin_account_idx)'
        display-name: New admin
        user-display: true

- name: SetReporterArgs
  kind:
    struct:
      display-name: Set feed reporter
      packed: true
      fields:
      - name: feed_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: feed
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(feed_account_idx)'
        display-name: Feed
        user-display: true
      - name: new_reporter_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: new_reporter
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(new_reporter_account_idx)'
        display-name: New reporter
        user-display: true

# Instruction discriminants:
#   0 CREATE_FEED
#   1 POST_UPDATE
#   2 SET_PARAMS
#   3 SET_ADMIN
#   4 SET_REPORTER
- name: OracleInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: discriminant
        user-display: false
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - discriminant
            variants:
            - name: create_feed
              tag-value: 0
              variant-type:
                type-ref:
                  name: CreateFeedArgs
            - name: post_update
              tag-value: 1
              variant-type:
                type-ref:
                  name: PostUpdateArgs
            - name: set_params
              tag-value: 2
              variant-type:
                type-ref:
                  name: SetParamsArgs
            - name: set_admin
              tag-value: 3
              variant-type:
                type-ref:
                  name: SetAdminArgs
            - name: set_reporter
              tag-value: 4
              variant-type:
                type-ref:
                  name: SetReporterArgs

# ── Feed accounts ──

# Common feed data following the leading account_type byte.
- name: OracleFeedCommonData
  kind:
    struct:
      display-name: Feed
      packed: true
      fields:
      - name: max_staleness_ns
        display-name: Max staleness (ns)
        field-type:
          primitive: u64
      - name: last_update_ns
        display-name: Last update (ns)
        field-type:
          primitive: u64
      - name: admin_address
        display-name: Admin
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: reporter_address
        display-name: Reporter
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: feed_name
        display-name: Feed name
        field-type:
          type-ref:
            name: FeedName64

- name: OraclePriceFeedData
  kind:
    struct:
      display-name: Price feed
      packed: true
      fields:
      - name: common
        user-display: false
        field-type:
          type-ref:
            name: OracleFeedCommonData
      - name: price
        user-display: false
        field-type:
          primitive: u64
      - name: price_display
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'if exponent <= 0 { `${toDecimal(price, 0 - exponent)}` } else { `${price} x 10^${exponent}` }'
        display-name: Price
        user-display: true
      - name: max_variance_bps
        user-display: false
        field-type:
          primitive: u32
      - name: max_variance
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: '`${toDecimal(max_variance_bps, 2)}%`'
        display-name: Max variance
        user-display: true
      - name: exponent
        display-name: Exponent
        field-type:
          primitive: i32

- name: OracleBooleanFeedData
  kind:
    struct:
      display-name: Boolean feed
      packed: true
      fields:
      - name: common
        user-display: false
        field-type:
          type-ref:
            name: OracleFeedCommonData
      - name: value
        display-name: Value
        field-type:
          primitive: u8

# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
# price_feed_v1 is 161 bytes total; bool_feed_v1 is 146 bytes total.
- name: OracleFeedAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: price_feed_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: OraclePriceFeedData
            - name: bool_feed_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: OracleBooleanFeedData

# ── Events ──

- name: PriceUpdateEventData
  kind:
    struct:
      display-name: Price updated
      packed: true
      fields:
      - name: feed_name
        display-name: Feed name
        field-type:
          type-ref:
            name: FeedName64
      - name: feed_address
        display-name: Feed
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: old_price
        display-name: Previous price (raw)
        field-type:
          primitive: u64
      - name: new_price
        display-name: New price (raw)
        field-type:
          primitive: u64
      - name: timestamp_ns
        display-name: Timestamp (ns)
        field-type:
          primitive: u64
      - name: time
        display-name: Time
        user-display: true
        type: synthetic
        return-type: { type-ref: { name: Timestamp } }
        expression: 'timestamp(timestamp_ns / 1000000000)'

- name: BooleanUpdateEventData
  kind:
    struct:
      display-name: Boolean value updated
      packed: true
      fields:
      - name: feed_name
        display-name: Feed name
        field-type:
          type-ref:
            name: FeedName64
      - name: feed_address
        display-name: Feed
        field-type:
          type-ref:
            name: Pubkey
            package: "thru.common.primitives"
      - name: old_value
        display-name: Previous value
        field-type:
          primitive: u8
      - name: new_value
        display-name: New value
        field-type:
          primitive: u8
      - name: timestamp_ns
        display-name: Timestamp (ns)
        field-type:
          primitive: u64
      - name: time
        display-name: Time
        user-display: true
        type: synthetic
        return-type: { type-ref: { name: Timestamp } }
        expression: 'timestamp(timestamp_ns / 1000000000)'

# event_type=1 is PRICE_UPDATE; event_type=2 is BOOL_UPDATE.
- name: OracleEvent
  kind:
    struct:
      packed: true
      fields:
      - name: event_type
        user-display: false
        field-type:
          primitive: u8
      - name: data
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - event_type
            variants:
            - name: price_update
              tag-value: 1
              variant-type:
                type-ref:
                  name: PriceUpdateEventData
            - name: boolean_update
              tag-value: 2
              variant-type:
                type-ref:
                  name: BooleanUpdateEventData

# ── Errors ──

# Error codes:
#   1  INVALID_INSTRUCTION_DATA_SIZE
#   2  INVALID_INSTRUCTION
#   3  UNAUTHORIZED_OPERATION
#   4  FEED_ALREADY_EXISTS
#   5  INVALID_FEED_ACCOUNT
#   6  INVALID_ACCOUNT_IDX
#   7  INVALID_FEED_NAME_LENGTH
#   8  INVALID_FEED_TYPE
#   9  UPDATE_TOO_STALE
#   10 FEED_TYPE_MISMATCH
#   11 INVALID_BOOL_VALUE
- name: OracleError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction_data_size
              tag-value: 1
              comment: Instruction data is too short or the wrong size for this instruction.
            - name: invalid_instruction
              tag-value: 2
              comment: Instruction is not a known oracle instruction.
            - name: unauthorized_operation
              tag-value: 3
              comment: The signer is not allowed to do this, or the feed account is not writable in this transaction.
            - name: feed_already_exists
              tag-value: 4
              comment: A feed already exists at this account.
            - name: invalid_feed_account
              tag-value: 5
              comment: The feed account is not a feed of the expected type.
            - name: invalid_account_idx
              tag-value: 6
              comment: An account index in the instruction is outside the account list of the transaction.
            - name: invalid_feed_name_length
              tag-value: 7
              comment: The feed name is empty or too long.
            - name: invalid_feed_type
              tag-value: 8
              comment: The feed type is not known.
            - name: update_too_stale
              tag-value: 9
              comment: The update is too old to be accepted.
            - name: feed_type_mismatch
              tag-value: 10
              comment: The feed is of a different type than the instruction expects.
            - name: invalid_bool_value
              tag-value: 11
              comment: A boolean feed value must be 0 or 1.
