abi:
  package: thru.program.consensus_validator
  name: Consensus Validator
  abi-version: 1
  package-version: 1.1.0
  description: >-
    Consensus validator program. It owns the attestor table, stakes WTHRU
    into the converted vault for attestor power at the table's
    stake_units_per_weight rate, verifies BLS-aggregated block
    certificates, and pays attestor rewards from the WTHRU unclaimed vault.
  imports:
    # thru_primitives
    - type: path
      path: thru_primitives.abi.yaml
  options:
    program-metadata:
      root-types:
        instruction-root: ConsensusValidatorInstruction
        account-root: ConsensusValidatorAccount
        errors: ConsensusValidatorError
types:
  - name: BlsPubkey
    kind:
      struct:
        packed: true
        comment: In-memory blst_p1_affine point (x and y, 48 bytes each).
        fields:
          - name: bytes
            field-type:
              array:
                size: { literal: { u64: 96 } }
                element-type: { primitive: u8 }
  - name: BlsSignature
    kind:
      struct:
        packed: true
        comment: In-memory blst_p2_affine point (x and y, 96 bytes each).
        fields:
          - name: bytes
            field-type:
              array:
                size: { literal: { u64: 192 } }
                element-type: { primitive: u8 }
  - name: InitArgs
    kind:
      struct:
        packed: true
        display-name: Initialize attestor table
        fields:
          - name: attestor_table
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(attestor_table_idx)'
            display-name: Attestor table
            user-display: true
          - name: wthru_mint
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(wthru_mint_idx)'
            display-name: WTHRU mint
            user-display: true
          - name: converted_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(converted_vault_idx)'
            display-name: Converted vault
            user-display: true
          - name: unclaimed_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(unclaimed_vault_idx)'
            display-name: Unclaimed vault
            user-display: true
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: converted_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: unclaimed_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: wthru_mint_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: initial_entry_count
            display-name: Initial server count
            field-type: { primitive: u64 }
          - name: max_validators
            display-name: Max validators
            field-type: { primitive: u64 }
          - name: delta1
            display-name: Delta 1
            field-type: { primitive: u64 }
          - name: delta2
            display-name: Delta 2
            field-type: { primitive: u64 }
          - name: converted_vault_proof_size
            user-display: false
            field-type: { primitive: u64 }
          - name: unclaimed_vault_proof_size
            user-display: false
            field-type: { primitive: u64 }
          - name: table_proof_size
            user-display: false
            field-type: { primitive: u64 }
          - name: max_pending_blocks
            display-name: Max pending blocks
            field-type: { primitive: u64 }
          - name: stake_units_per_weight
            display-name: Stake units per weight
            field-type: { primitive: u64 }
          - name: min_stake
            display-name: Min stake
            field-type: { primitive: u64 }
          - name: max_decay_bps
            display-name: Max decay (bps)
            field-type: { primitive: u64 }
          - name: idle_gap_decay_bps
            display-name: Idle gap decay (bps)
            field-type: { primitive: u64 }
          - name: max_idle_gap_decay_bps
            display-name: Max idle gap decay (bps)
            field-type: { primitive: u64 }
          - name: attestor_decay_fraction_bps
            display-name: Attestor decay fraction (bps)
            field-type: { primitive: u64 }
          - name: converted_vault_proof
            user-display: false
            field-type:
              array:
                size: { field-ref: { path: [converted_vault_proof_size] } }
                element-type: { primitive: u8 }
          - name: unclaimed_vault_proof
            user-display: false
            field-type:
              array:
                size: { field-ref: { path: [unclaimed_vault_proof_size] } }
                element-type: { primitive: u8 }
          - name: table_proof
            user-display: false
            field-type:
              array:
                size: { field-ref: { path: [table_proof_size] } }
                element-type: { primitive: u8 }
  - name: ActivateArgs
    kind:
      struct:
        packed: true
        display-name: Activate attestor
        fields:
          - name: attestor_identity
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(identity_idx)'
            display-name: Attestor identity
            user-display: true
          - name: source_token_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(source_token_account_idx)'
            display-name: Source token account
            user-display: true
          - name: converted_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(converted_vault_idx)'
            display-name: Converted vault
            user-display: true
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: source_token_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: converted_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: identity_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: bls_pk
            user-display: false
            field-type: { type-ref: { name: BlsPubkey } }
          - name: bls_pop
            user-display: false
            field-type: { type-ref: { name: BlsSignature } }
          - name: claim_authority
            display-name: Claim authority
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: token_amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
  - name: DeactivateArgs
    kind:
      struct:
        packed: true
        display-name: Deactivate attestor
        fields:
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: unclaimed_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: dest_token_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: identity_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: attestor_identity
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(identity_idx)'
            display-name: Attestor identity
            user-display: true
          - name: unclaimed_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(unclaimed_vault_idx)'
            display-name: Unclaimed vault
            user-display: true
          - name: dest_token_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(dest_token_account_idx)'
            display-name: Destination token account
            user-display: true
  - name: ConvertTokensArgs
    kind:
      struct:
        packed: true
        display-name: Convert attestor tokens
        fields:
          - name: attestor_identity
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(identity_idx)'
            display-name: Attestor identity
            user-display: true
          - name: source_token_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(source_token_account_idx)'
            display-name: Source token account
            user-display: true
          - name: converted_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(converted_vault_idx)'
            display-name: Converted vault
            user-display: true
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: source_token_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: converted_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: identity_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: token_amount
            display-name: Amount (base units)
            field-type: { primitive: u64 }
  - name: ClaimArgs
    kind:
      struct:
        packed: true
        display-name: Claim attestor rewards
        fields:
          - name: attestor
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'subject_attestor'
            display-name: Attestor
            user-display: true
          - name: claim_authority
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(claim_authority_idx)'
            display-name: Claim authority
            user-display: true
          - name: unclaimed_vault
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(unclaimed_vault_idx)'
            display-name: Unclaimed vault
            user-display: true
          - name: dest_token_account
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(dest_token_account_idx)'
            display-name: Destination token account
            user-display: true
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: unclaimed_vault_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: dest_token_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: claim_authority_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: subject_attestor
            user-display: false
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
  - name: SetClaimAuthorityArgs
    kind:
      struct:
        packed: true
        display-name: Set claim authority
        fields:
          - name: attestor
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'subject_attestor'
            display-name: Attestor
            user-display: true
          - name: current_claim_authority
            type: synthetic
            return-type: { type-ref: { name: Pubkey } }
            expression: 'accountAddress(current_claim_auth_idx)'
            display-name: Current claim authority
            user-display: true
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: current_claim_auth_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: subject_attestor
            user-display: false
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: new_claim_authority
            display-name: New claim authority
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
  - name: BlockCommitment
    kind:
      struct:
        packed: true
        comment: >-
          The certified block hash is blake3("tn-block-commitment" || commitment).
          header_body and footer_body are the verbatim serialized block bodies.
        fields:
          - name: header_body
            field-type:
              array:
                size: { literal: { u64: 104 } }
                element-type: { primitive: u8 }
          - name: txn_data_sz
            field-type: { primitive: u64 }
          - name: txn_data_hash
            field-type:
              type-ref:
                name: Hash
                package: "thru.common.primitives"
          - name: footer_body
            field-type:
              array:
                size: { literal: { u64: 8 } }
                element-type: { primitive: u8 }
  - name: CertificatePayload
    kind:
      struct:
        packed: true
        fields:
          - name: round
            field-type: { primitive: u32 }
          - name: vote
            field-type: { primitive: u8 }
          - name: generation
            field-type:
              array:
                size: { literal: { u64: 8 } }
                element-type: { primitive: u8 }
          - name: block_hash
            field-type:
              type-ref:
                name: Hash
                package: "thru.common.primitives"
          - name: slot
            field-type: { primitive: u64 }
          - name: bet_time
            field-type: { primitive: u64 }
  - name: Certificate
    kind:
      struct:
        packed: true
        fields:
          - name: payload
            field-type: { type-ref: { name: CertificatePayload } }
          - name: weight_slot
            field-type: { primitive: u64 }
          - name: aggregate_signature
            field-type: { type-ref: { name: BlsSignature } }
          - name: aggregate_pubkey
            field-type: { type-ref: { name: BlsPubkey } }
          - name: count
            field-type: { primitive: u32 }
  - name: PostCertificateArgs
    kind:
      struct:
        packed: true
        display-name: Post block certificate
        comment: >-
          The instruction is followed by the certificate signer bitset,
          (max_validators + 63) / 64 little-endian u64 words, where
          max_validators is read from the attestor table rather than from
          instruction data. The bitset is therefore not described here.
        fields:
          - name: attestor_table_idx
            user-display: false
            field-type: { primitive: u64 }
          - name: bond_account_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: bond_ta_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: escrow_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: bp_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: token_program_idx
            user-display: false
            field-type: { primitive: u16 }
          - name: block_commitment
            user-display: false
            field-type: { type-ref: { name: BlockCommitment } }
          - name: certificate
            user-display: false
            field-type: { type-ref: { name: Certificate } }
          - name: slot
            type: synthetic
            return-type: { primitive: u64 }
            expression: 'certificate.payload.slot'
            display-name: Slot
            user-display: true
  - name: InitValidatorManagerArgs
    kind:
      struct:
        packed: true
        comment: >-
          Sets the first validator manager while none is set (genesis may
          already have set one). The program's application authority (the
          authority in its managed metadata at program_meta_idx) must
          authorize it; it may be a multisig, which runs this through
          propose, approve and execute. The manager may not be zero, this
          program or the Multisig program.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: program_meta_idx
            field-type: { primitive: u16 }
          - name: validator_manager
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
  - name: SetValidatorManagerArgs
    kind:
      struct:
        packed: true
        comment: >-
          Hands the validator manager role to another key (not zero, this
          program or the Multisig program). The current manager authorizes
          it.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: validator_manager
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
  - name: SetSelfServiceArgs
    kind:
      struct:
        packed: true
        comment: >-
          Enables (nonzero) or disables (zero) self-service Activate,
          ConvertTokens and Deactivate. The manager authorizes it. Claim,
          SetClaimAuthority and PostCertificate are never gated.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: enabled
            field-type: { primitive: u8 }
  - name: ManagerActivateArgs
    kind:
      struct:
        packed: true
        comment: >-
          Seats identity with weight and no payment. The manager authorizes
          it; the identity does not sign. Proof of possession, the one
          Activate per block allowance and the base's spacing and turnover
          limits still apply. Invoked by another program (a multisig
          manager), it runs the same way and emits the same event.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: identity
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: bls_pk
            field-type: { type-ref: { name: BlsPubkey } }
          - name: bls_pop
            field-type: { type-ref: { name: BlsSignature } }
          - name: claim_authority
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: weight
            field-type: { primitive: u64 }
  - name: ManagerDeactivateArgs
    kind:
      struct:
        packed: true
        comment: >-
          Removes identity's seat. The manager authorizes it. The seat's
          unclaimed rewards are forfeited (they stay in the unclaimed vault),
          and its converted stake stays in the converted vault. Invoked by
          another program, it runs the same way and emits the same event.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: identity
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
  - name: SetParamsArgs
    kind:
      struct:
        packed: true
        comment: >-
          Replaces the attestor table's staking parameters, under the rules
          Init applies (nonzero stake_units_per_weight; min_stake a nonzero
          multiple of it; max_decay_bps <= 10000; idle_gap_decay_bps <=
          max_idle_gap_decay_bps <= max_decay_bps; attestor_decay_fraction_bps
          <= 10000). The manager authorizes it. Effects from the next
          instruction: Activate and ConvertTokens price new stake at the new
          rate and increment (existing seats keep their weight); the next
          decay emission charges the payment already pending under the new
          rate, fraction and caps.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: stake_units_per_weight
            field-type: { primitive: u64 }
          - name: min_stake
            field-type: { primitive: u64 }
          - name: max_decay_bps
            field-type: { primitive: u64 }
          - name: idle_gap_decay_bps
            field-type: { primitive: u64 }
          - name: max_idle_gap_decay_bps
            field-type: { primitive: u64 }
          - name: attestor_decay_fraction_bps
            field-type: { primitive: u64 }
  - name: ManagerSetWeightArgs
    kind:
      struct:
        packed: true
        comment: >-
          Sets a seated identity's weight to weight (absolute, so it
          replaces weight bought with ConvertTokens). The base only adds
          weight, so weight must be above the seat's weight after this
          update's decay. No tokens move. The manager authorizes it; invoked
          by another program, it runs the same way and emits the same event.
        fields:
          - name: attestor_table_idx
            field-type: { primitive: u64 }
          - name: identity
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: weight
            field-type: { primitive: u64 }
  - name: ConsensusValidatorInstruction
    kind:
      struct:
        packed: true
        fields:
          - name: tag
            user-display: false
            field-type: { primitive: u32 }
          - name: payload
            field-type:
              enum:
                packed: true
                tag-ref: { field-ref: { path: [tag] } }
                variants:
                  - name: init
                    tag-value: 0
                    variant-type: { type-ref: { name: InitArgs } }
                  - name: activate
                    tag-value: 1
                    variant-type: { type-ref: { name: ActivateArgs } }
                  - name: deactivate
                    tag-value: 2
                    variant-type: { type-ref: { name: DeactivateArgs } }
                  - name: convert_tokens
                    tag-value: 3
                    variant-type: { type-ref: { name: ConvertTokensArgs } }
                  - name: claim
                    tag-value: 4
                    variant-type: { type-ref: { name: ClaimArgs } }
                  - name: set_claim_authority
                    tag-value: 5
                    variant-type: { type-ref: { name: SetClaimAuthorityArgs } }
                  - name: post_certificate
                    tag-value: 6
                    variant-type: { type-ref: { name: PostCertificateArgs } }
                  - name: init_validator_manager
                    tag-value: 8
                    variant-type: { type-ref: { name: InitValidatorManagerArgs } }
                  - name: set_validator_manager
                    tag-value: 9
                    variant-type: { type-ref: { name: SetValidatorManagerArgs } }
                  - name: set_self_service
                    tag-value: 10
                    variant-type: { type-ref: { name: SetSelfServiceArgs } }
                  - name: manager_activate
                    tag-value: 11
                    variant-type: { type-ref: { name: ManagerActivateArgs } }
                  - name: manager_deactivate
                    tag-value: 12
                    variant-type: { type-ref: { name: ManagerDeactivateArgs } }
                  - name: set_params
                    tag-value: 13
                    variant-type: { type-ref: { name: SetParamsArgs } }
                  - name: manager_set_weight
                    tag-value: 14
                    variant-type: { type-ref: { name: ManagerSetWeightArgs } }
  # Account root: byte 0 is the account discriminator (account_type), one
  # value per (account kind, layout). Values are never reused; a new layout
  # or a new kind takes the next unused value.
  - name: ConsensusValidatorAccount
    kind:
      struct:
        packed: true
        fields:
          - name: account_type
            user-display: false
            field-type: { primitive: u8 }
          - name: payload
            field-type:
              enum:
                packed: true
                tag-ref: { field-ref: { path: [account_type] } }
                variants:
                  - name: attestor_table_v1
                    tag-value: 1
                    variant-type: { type-ref: { name: AttestorTable } }
  - name: AttestorTable
    kind:
      struct:
        packed: true
        display-name: Attestor table
        comment: >-
          Attestor table payload: the 281 bytes of header fields after the
          account_type byte (282 with it), then header_reserved, then body. The
          header (account_type, the fields and header_reserved) is exactly one
          4096-byte page. header_reserved is reserved for future header fields
          and is always zero; a new field takes its bytes from the front of it,
          so the body and the base state machine at base_sm_off 4096 never
          move. wthru_mint is the
          mint of both vaults (stake and rewards) and the mint PostCertificate
          derives bond token accounts from. stake_units_per_weight is the WTHRU
          base units one unit of attestor power costs. min_stake is the stake
          increment in WTHRU base units: every Activate and ConvertTokens
          amount must be a whole, nonzero multiple of it (it is itself a whole
          multiple of stake_units_per_weight, set by Init or genesis).
          pending_decay is the attestor payment (WTHRU base units, saturating)
          of the slots since the last decay emission that are still in the
          stored 512-slot block history; pending_idle_slots (saturating)
          counts the older slots of an idle gap, whose payments are unknown
          (a 513-slot gap is 1, a 600-slot gap 88). An emission removes
          idle_gap_decay_bps of the committee weight per idle slot (at most
          max_idle_gap_decay_bps in all) plus the payment converted to power
          at stake_units_per_weight and scaled by attestor_decay_fraction_bps
          (pending * attestor_decay_fraction_bps / (stake_units_per_weight *
          10000), rounded down once; 10000 charges the whole power, 0 none),
          at most max_decay_bps of the committee weight in all, dropping the
          excess, and clears both. idle_gap_decay_bps <=
          max_idle_gap_decay_bps <= max_decay_bps, and
          attestor_decay_fraction_bps <= 10000.
          base_sm_off, metadata_off and pending_map_off are offsets from the
          start of the account (byte 0 is account_type). The body holds the
          consensus base state machine at base_sm_off (4096, right after the
          header page), the per-seat metadata
          array (server_count entries of claim_authority and unclaimed_tokens)
          at metadata_off, and the deferred-payout map (pending_cap entries of
          block_hash, weight_slot, credit_basis and a (server_count + 63) / 64
          word bitset) at pending_map_off.
          validator_manager (zero for none) grants and removes seats without
          tokens and sets the parameters; it comes from genesis or the
          program's application authority (InitValidatorManager).
          self_service_disabled turns off Activate, ConvertTokens and
          Deactivate.
        fields:
          - name: token_program_id
            user-display: false
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: wthru_mint
            display-name: WTHRU mint
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: converted_vault
            display-name: Converted vault
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: unclaimed_vault
            display-name: Unclaimed vault
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: validator_manager
            display-name: Validator manager
            field-type:
              type-ref:
                name: Pubkey
                package: "thru.common.primitives"
          - name: server_count
            display-name: Server count
            field-type: { primitive: u64 }
          - name: base_sm_off
            user-display: false
            field-type: { primitive: u64 }
          - name: metadata_off
            user-display: false
            field-type: { primitive: u64 }
          - name: pending_decay
            user-display: false
            field-type: { primitive: u64 }
          - name: last_decay_calc_slot
            user-display: false
            field-type: { primitive: u64 }
          - name: last_processed_slot
            display-name: Last processed slot
            field-type: { primitive: u64 }
          - name: pending_map_off
            user-display: false
            field-type: { primitive: u64 }
          - name: pending_cap
            user-display: false
            field-type: { primitive: u64 }
          - name: stake_units_per_weight
            display-name: Stake units per weight
            field-type: { primitive: u64 }
          - name: min_stake
            display-name: Min stake
            field-type: { primitive: u64 }
          - name: max_decay_bps
            display-name: Max decay (bps)
            field-type: { primitive: u64 }
          - name: idle_gap_decay_bps
            display-name: Idle gap decay (bps)
            field-type: { primitive: u64 }
          - name: max_idle_gap_decay_bps
            display-name: Max idle gap decay (bps)
            field-type: { primitive: u64 }
          - name: attestor_decay_fraction_bps
            display-name: Attestor decay fraction (bps)
            field-type: { primitive: u64 }
          - name: pending_idle_slots
            display-name: Pending idle slots
            field-type: { primitive: u64 }
          - name: self_service_disabled
            display-name: Self-service disabled
            field-type: { primitive: u8 }
          - name: header_reserved
            user-display: false
            field-type:
              array:
                comment: >-
                  Reserved for future attestor table header fields; always zero.
                  New fields take their bytes from the front, so the header stays
                  one 4096-byte page and the base state machine stays at
                  base_sm_off 4096.
                size: { literal: { u64: 3814 } }
                element-type: { primitive: u8 }
          - name: body
            user-display: false
            field-type:
              array:
                size:
                  sub:
                    left: { field-ref: { path: ["__buffer_size"] } }
                    right: { literal: { u64: 4095 } }
                element-type: { primitive: u8 }
  - name: ConsensusValidatorError
    kind:
      struct:
        packed: true
        comment: Error codes are the TN_CONSENSUS_VALIDATOR_ERR_* values (0x01-0xBA) in tn_consensus_validator_program.h; 0x84 is an invalid attestor table.
        fields:
          - name: code
            field-type: { primitive: u64 }
          - name: error
