abi:
  package: thru.program.thru_registrar
  name: "Thru Registrar"
  abi-version: 1
  package-version: "0.2.0"
  description: ABI for the Thru registrar program instruction envelopes and account state
  imports: []
  options:
    program-metadata:
      root-types:
        instruction-root: "ThruRegistrarInstruction"
        account-root: "ThruRegistrarAccount"
        errors: "ThruRegistrarError"
types:
- name: Pubkey
  kind:
    struct:
      packed: true
      fields:
      - name: bytes
        field-type:
          array:
            size:
              literal:
                u64: 32
            element-type:
              primitive: u8
- name: Config
  kind:
    struct:
      packed: true
      display-name: Registrar config
      fields:
      - name: root_domain
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(root_domain_name, root_domain_name_length)'
        display-name: Root domain
        user-display: true
      - name: name_service_program_id
        display-name: Name service program
        field-type:
          type-ref:
            name: Pubkey
      - name: root_registrar_account
        display-name: Root registrar
        field-type:
          type-ref:
            name: Pubkey
      - name: treasurer_account
        display-name: Treasury token account
        field-type:
          type-ref:
            name: Pubkey
      - name: token_mint_account
        display-name: Payment token mint
        field-type:
          type-ref:
            name: Pubkey
      - name: token_program_id
        display-name: Token program
        field-type:
          type-ref:
            name: Pubkey
      - name: root_domain_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: root_domain_name_length
        user-display: false
        field-type:
          primitive: u32
      - name: price_per_year
        display-name: Price per year (base units)
        field-type:
          primitive: u64
      - name: total_domains_sold
        display-name: Domains sold
        field-type:
          primitive: u64
- name: Lease
  kind:
    struct:
      packed: true
      display-name: Domain lease
      fields:
      - name: domain_name_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(domain_name, domain_name_length)'
        display-name: Domain name
        user-display: true
      - name: domain_account
        display-name: Domain
        field-type:
          type-ref:
            name: Pubkey
      - name: owner
        display-name: Owner
        field-type:
          type-ref:
            name: Pubkey
      - name: domain_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: domain_name_length
        user-display: false
        field-type:
          primitive: u32
      - name: lease_start_time
        display-name: Lease start (block time, ns)
        field-type:
          primitive: u64
      - name: lease_end_time
        display-name: Lease end (block time, ns)
        field-type:
          primitive: u64
# Account root: byte 0 is the account discriminator (account_type), one value
# per (account kind, layout). Values are never reused; a new layout or a new
# kind takes the next unused value.
- name: ThruRegistrarAccount
  kind:
    struct:
      packed: true
      fields:
      - name: account_type
        user-display: false
        field-type:
          primitive: u8
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - account_type
            variants:
            - name: config_v1
              tag-value: 1
              variant-type:
                type-ref:
                  name: Config
            - name: lease_v1
              tag-value: 2
              variant-type:
                type-ref:
                  name: Lease
- name: InitializeRegistryArgs
  kind:
    struct:
      packed: true
      display-name: Create domain registry
      fields:
      - name: root_domain
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(root_domain_name, root_domain_name_length)'
        display-name: Root domain
        user-display: true
      - name: config_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: config_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(config_account_idx)'
        display-name: Registrar config
        user-display: true
      - name: name_service_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: name_service_program
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(name_service_program_account_idx)'
        display-name: Name service program
        user-display: true
      - name: root_registrar_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: root_registrar
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(root_registrar_account_idx)'
        display-name: Root registrar
        user-display: true
      - name: treasurer_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: treasurer_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(treasurer_account_idx)'
        display-name: Treasury token account
        user-display: true
      - name: token_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_mint
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(token_mint_account_idx)'
        display-name: Payment token mint
        user-display: true
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_program
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(token_program_account_idx)'
        display-name: Token program
        user-display: true
      - name: root_domain_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: root_domain_name_length
        user-display: false
        field-type:
          primitive: u32
      - name: price_per_year
        display-name: Price per year (base units)
        field-type:
          primitive: u64
- name: PurchaseDomainArgs
  kind:
    struct:
      packed: true
      display-name: Buy domain
      fields:
      - name: domain_name_text
        type: synthetic
        return-type: { type-ref: { name: Text } }
        expression: 'text(domain_name, domain_name_length)'
        display-name: Domain name
        user-display: true
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(0)'
        display-name: Owner
        user-display: true
      - name: config_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(lease_account_idx)'
        display-name: Lease
        user-display: true
      - name: domain_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(domain_account_idx)'
        display-name: Domain
        user-display: true
      - name: name_service_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: root_registrar_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: treasurer_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: treasurer_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(treasurer_account_idx)'
        display-name: Treasury token account
        user-display: true
      - name: payer_token_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: payer_token_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(payer_token_account_idx)'
        display-name: Payer token account
        user-display: true
      - name: token_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: domain_name
        format: text
        user-display: false
        field-type:
          array:
            size:
              literal:
                u64: 64
            element-type:
              primitive: u8
      - name: domain_name_length
        user-display: false
        field-type:
          primitive: u32
      - name: years
        display-name: Years
        field-type:
          primitive: u8
- name: RenewLeaseArgs
  kind:
    struct:
      packed: true
      display-name: Renew domain lease
      fields:
      - name: owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(0)'
        display-name: Owner
        user-display: true
      - name: config_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(lease_account_idx)'
        display-name: Lease
        user-display: true
      - name: treasurer_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: treasurer_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(treasurer_account_idx)'
        display-name: Treasury token account
        user-display: true
      - name: payer_token_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: payer_token_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(payer_token_account_idx)'
        display-name: Payer token account
        user-display: true
      - name: token_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: years
        display-name: Years
        field-type:
          primitive: u8
- name: ClaimExpiredDomainArgs
  kind:
    struct:
      packed: true
      display-name: Claim expired domain
      fields:
      - name: new_owner
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(0)'
        display-name: New owner
        user-display: true
      - name: config_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: lease_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(lease_account_idx)'
        display-name: Lease
        user-display: true
      - name: treasurer_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: treasurer_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(treasurer_account_idx)'
        display-name: Treasury token account
        user-display: true
      - name: payer_token_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: payer_token_account
        type: synthetic
        return-type: { type-ref: { name: Pubkey } }
        expression: 'accountAddress(payer_token_account_idx)'
        display-name: Payer token account
        user-display: true
      - name: token_mint_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: token_program_account_idx
        user-display: false
        field-type:
          primitive: u16
      - name: years
        display-name: Years
        field-type:
          primitive: u8
- name: ThruRegistrarInstruction
  kind:
    struct:
      packed: true
      fields:
      - name: tag
        user-display: false
        field-type:
          primitive: u32
      - name: payload
        field-type:
          enum:
            packed: true
            tag-ref:
              field-ref:
                path:
                - tag
            variants:
            - name: initialize_registry
              tag-value: 0
              variant-type:
                type-ref:
                  name: InitializeRegistryArgs
            - name: purchase_domain
              tag-value: 1
              variant-type:
                type-ref:
                  name: PurchaseDomainArgs
            - name: renew_lease
              tag-value: 2
              variant-type:
                type-ref:
                  name: RenewLeaseArgs
            - name: claim_expired_domain
              tag-value: 3
              variant-type:
                type-ref:
                  name: ClaimExpiredDomainArgs
- name: ThruRegistrarError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
      - name: error
        field-type:
          enum:
            tag-ref:
              field-ref:
                path:
                - code
            variants:
            - name: invalid_instruction
              tag-value: 1
              comment: Instruction data is too short, the wrong size, or not a known registrar instruction.
            - name: invalid_account
              tag-value: 2
              comment: An account index is outside the account list of the transaction, or the account is not the expected registrar account.
            - name: unauthorized
              tag-value: 3
              comment: The signer does not own this domain lease.
            - name: invalid_domain_name
              tag-value: 4
              comment: The domain name is too short, too long, or contains characters that are not allowed.
            - name: invalid_lease_duration
              tag-value: 5
              comment: The lease length in years is zero.
            - name: max_supply_reached
              tag-value: 6
              comment: The price or a counter would exceed the largest allowed value.
            - name: lease_expired
              tag-value: 7
              comment: The domain lease has already expired.
            - name: lease_not_expired
              tag-value: 8
              comment: The domain lease has not expired yet.
            - name: invalid_token_program
              tag-value: 9
              comment: The token program account is not the official token program.
            - name: invalid_name_service_program
              tag-value: 10
              comment: The name service program account is not the official name service program.
