abi:
  package: "compliance.shared_count_c"
  abi-version: 1
  package-version: "1.0.0"
  description: "Two arrays sized by one count field"

types:
  - name: "SharedCount"
    kind:
      struct:
        packed: true
        fields:
          - name: "count"
            field-type:
              primitive: u8
          - name: "a"
            field-type:
              array:
                size:
                  field-ref:
                    path: ["count"]
                element-type:
                  primitive: u32
          - name: "b"
            field-type:
              array:
                size:
                  field-ref:
                    path: ["count"]
                element-type:
                  primitive: u16
          - name: "tail"
            field-type:
              primitive: u8
  - name: "SoloCount"
    kind:
      struct:
        packed: true
        fields:
          - name: "count"
            field-type:
              primitive: u8
          - name: "a"
            field-type:
              array:
                size:
                  field-ref:
                    path: ["count"]
                element-type:
                  primitive: u8
