abi:
  package: "compliance.nested_inline_enums"
  abi-version: 1
  package-version: "1.0.0"
  description: "Inline enums as array elements and as another enum's payload"

types:
  - name: "EnumArrayHolder"
    kind:
      struct:
        packed: true
        fields:
          - name: "kind"
            field-type:
              primitive: u8
          - name: "count"
            field-type:
              primitive: u8
          - name: "items"
            field-type:
              array:
                jagged: true
                size:
                  field-ref:
                    path: ["count"]
                element-type:
                  enum:
                    packed: true
                    tag-ref:
                      field-ref:
                        path: ["kind"]
                    variants:
                      - name: "small"
                        tag-value: 0
                        variant-type:
                          primitive: u8
                      - name: "wide"
                        tag-value: 1
                        variant-type:
                          struct:
                            packed: true
                            fields:
                              - name: "value"
                                field-type:
                                  primitive: u32
          - name: "tail"
            field-type:
              primitive: u8
  - name: "EnumPayloadHolder"
    kind:
      struct:
        packed: true
        fields:
          - name: "outer_tag"
            field-type:
              primitive: u8
          - name: "inner_tag"
            field-type:
              primitive: u8
          - name: "body"
            field-type:
              enum:
                packed: true
                tag-ref:
                  field-ref:
                    path: ["outer_tag"]
                variants:
                  - name: "nested"
                    tag-value: 0
                    variant-type:
                      enum:
                        packed: true
                        tag-ref:
                          field-ref:
                            path: ["inner_tag"]
                        variants:
                          - name: "byte"
                            tag-value: 0
                            variant-type:
                              primitive: u8
                          - name: "quad"
                            tag-value: 1
                            variant-type:
                              primitive: u64
                  - name: "plain"
                    tag-value: 1
                    variant-type:
                      primitive: u16
          - name: "tail"
            field-type:
              primitive: u8
  - name: "TaggedElemHolder"
    kind:
      struct:
        packed: true
        fields:
          - name: "count"
            field-type:
              primitive: u8
          - name: "items"
            field-type:
              array:
                jagged: true
                size:
                  field-ref:
                    path: ["count"]
                element-type:
                  struct:
                    packed: true
                    fields:
                      - name: "tag"
                        field-type:
                          primitive: u8
                      - name: "body"
                        field-type:
                          enum:
                            packed: true
                            tag-ref:
                              field-ref:
                                path: ["tag"]
                            variants:
                              - name: "small"
                                tag-value: 0
                                variant-type:
                                  primitive: u8
                              - name: "pair"
                                tag-value: 1
                                variant-type:
                                  array:
                                    size:
                                      literal:
                                        u32: 2
                                    element-type:
                                      enum:
                                        packed: true
                                        tag-ref:
                                          field-ref:
                                            path: ["tag"]
                                        variants:
                                          - name: "x"
                                            tag-value: 0
                                            variant-type:
                                              primitive: u8
                                          - name: "y"
                                            tag-value: 1
                                            variant-type:
                                              primitive: u16
