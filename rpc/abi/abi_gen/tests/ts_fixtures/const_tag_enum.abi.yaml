abi:
  package: "test.const_tag_enum"
  abi-version: 1
  package-version: "1.0.0"
  description: "Top-level enum whose tag is a constant"
types:
  - name: "ConstEnum"
    kind:
      enum:
        packed: true
        tag-ref:
          literal:
            u8: 0
        variants:
          - name: "zero"
            tag-value: 0
            variant-type:
              primitive: u8
          - name: "one"
            tag-value: 1
            variant-type:
              primitive: u8
  - name: "Holder"
    kind:
      struct:
        packed: true
        fields:
          - name: "head"
            field-type:
              primitive: u8
          - name: "body"
            field-type:
              type-ref:
                name: "ConstEnum"
  - name: "SumTagEnum"
    kind:
      enum:
        packed: true
        tag-ref:
          add:
            left:
              literal:
                u8: 0
            right:
              literal:
                u8: 1
        variants:
          - name: "zero"
            tag-value: 0
            variant-type:
              primitive: u8
          - name: "one"
            tag-value: 1
            variant-type:
              primitive: u8
