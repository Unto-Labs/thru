abi:
  package: "test.inline_computed_tag"
  abi-version: 1
  package-version: "1.0.0"
  description: "Computed enum tags and payload sizes inside inline structs"

types:
  # An inline struct holding an enum tagged by (flags & 1).
  - name: "Outer"
    kind:
      struct:
        packed: true
        fields:
          - name: "inner"
            field-type:
              struct:
                packed: true
                fields:
                  - name: "flags"
                    field-type:
                      primitive: u8
                  - name: "body"
                    field-type:
                      enum:
                        packed: true
                        tag-ref:
                          bit-and:
                            left:
                              field-ref:
                                path: ["flags"]
                            right:
                              literal:
                                u64: 1
                        variants:
                          - name: "small"
                            tag-value: 0
                            variant-type:
                              primitive: u8
                          - name: "wide"
                            tag-value: 1
                            variant-type:
                              primitive: u16

  # The same enum directly in a packed struct: its size is not rounded up to
  # the u16 variant's alignment.
  - name: "Flat"
    kind:
      struct:
        packed: true
        fields:
          - name: "flags"
            field-type:
              primitive: u8
          - name: "body"
            field-type:
              enum:
                packed: true
                tag-ref:
                  bit-and:
                    left:
                      field-ref:
                        path: ["flags"]
                    right:
                      literal:
                        u64: 1
                variants:
                  - name: "small"
                    tag-value: 0
                    variant-type:
                      primitive: u8
                  - name: "wide"
                    tag-value: 1
                    variant-type:
                      primitive: u16

  # A size-discriminated union ending an inline struct: its payload size is
  # the bytes after `x`, not the whole inline struct.
  - name: "Sized"
    kind:
      struct:
        packed: true
        fields:
          - name: "inner"
            field-type:
              struct:
                packed: true
                fields:
                  - name: "x"
                    field-type:
                      primitive: u8
                  - name: "body"
                    field-type:
                      size-discriminated-union:
                        variants:
                          - name: "one"
                            expected-size: 1
                            variant-type:
                              primitive: u8
                          - name: "two"
                            expected-size: 2
                            variant-type:
                              primitive: u16
