[package]
name = "thru-abi-types"
version = "0.1.0"
edition = "2021"
description = "ABI type definitions for the Thru blockchain"
license = "Apache-2.0"
repository = "https://github.com/Unto-Labs/thru"
homepage = "https://thru.org/docs/abi/overview/"
keywords = ["thru", "abi", "blockchain", "codegen", "serialization"]
categories = ["encoding", "development-tools"]

[lib]
name = "abi_types"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_yml = "0.0.12"
