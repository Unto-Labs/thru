name: Thru CLI Artifacts

# Builds the thru CLI binaries, attaches them to the GitHub release, and
# publishes the CLI npm packages. This is deliberately separate from
# release.yml: npm publishing only needs the CLI binaries + checksums, so it
# must not be gated on (or poll for) the slower SDK/toolchain artifact jobs.
# Within this workflow `needs:` replaces polling entirely — publish-npm
# consumes the artifacts built in the same run.
#
# This workflow also runs in the public mirror repo (Unto-Labs/thru), so the
# same assets are publicly downloadable from its releases without
# authentication. Only the thru-net run publishes npm (NPM_TOKEN lives there);
# the mirror run stops at the repository guard.

on:
  release:
    types: [published]
  # Manual runs rebuild the thru CLI binaries for an existing release tag
  # (e.g. to retry a failed platform leg, reproduce a binary, or re-run a
  # failed npm publish — the publish steps are idempotent).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build thru CLI artifacts for (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Build thru CLI binaries for the npm platform packages and for direct
  # download. Asset platform names must match SUPPORTED_PLATFORMS in
  # web/packages/cli/scripts/platform.mjs.
  build-cli-artifacts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows support is best-effort for now: a failed Windows build must not
    # block the release or the npm publish of the other platforms.
    continue-on-error: ${{ matrix.best_effort || false }}
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      # Linux portability toolchain pin (see cli-cloud-vm-portability-plan.md).
      # Ubuntu 24.04's musl-dev for arm64, from the noble release pocket
      # (frozen, so the URL never moves). It ships the aarch64-linux-musl-gcc
      # wrapper around gcc-aarch64-linux-gnu, plus musl's aarch64 headers and
      # libc.a. Update both values together.
      MUSL_DEV_ARM64_DEB: "musl-dev_1.2.4-2_arm64.deb"
      MUSL_DEV_ARM64_SHA256: "56e4fa8e6fcd2825ca9e262e8807d2038d4a0e91274bd51fce1653b219f5ae92"
      # cargo-xwin 0.20+ needs rustc 1.89; the CLI is pinned to 1.88.
      CARGO_XWIN_VERSION: "0.19.2"
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are static musl executables, so they have no glibc
        # floor and run on any Linux kernel the Rust target supports,
        # including older cloud distros (Ubuntu 22.04 = 2.35, RHEL/Rocky 9
        # and Amazon Linux 2023 = 2.34, CentOS 7 = 2.17). Building plain gnu
        # targets on the Ubuntu 24.04 runner stamps a glibc 2.39 floor, which
        # fails to launch on all of the above. musl_cc / musl_ar compile and
        # archive the vendored C dependencies (openssl, libgit2, libssh2,
        # zlib, aws-lc, ring, blst) for the target.
        include:
          - os: ubuntu-large
            target: x86_64-unknown-linux-musl
            musl_cc: x86_64-linux-musl-gcc
            musl_ar: ar
            asset_platform: Linux-x86_64
          - os: ubuntu-large
            target: aarch64-unknown-linux-musl
            musl_cc: aarch64-linux-musl-gcc
            musl_ar: aarch64-linux-gnu-ar
            asset_platform: Linux-aarch64
          - os: macos-latest-xlarge
            target: aarch64-apple-darwin
            asset_platform: Darwin-arm64
          - os: macos-latest-xlarge
            target: x86_64-apple-darwin
            asset_platform: Darwin-x86_64
          # Windows is cross-compiled on Linux with cargo-xwin (clang-cl +
          # lld-link against the downloaded MSVC CRT and Windows SDK): a cold
          # build takes ~3.5 min here versus ~20 min on windows-latest. The
          # binary cannot run on this runner, so smoke-test-windows-cli runs
          # it on Windows before it becomes a release artifact.
          - os: ubuntu-large
            target: x86_64-pc-windows-msvc
            asset_platform: Windows-x86_64
            xwin: true
            best_effort: true

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        # On release events this resolves to the tagged commit anyway; on
        # workflow_dispatch it pins the build to the requested release tag.
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        # The CLI workspace only needs rpc/; skipping submodules keeps this
        # job fast and Windows-safe, and matches the public mirror layout
        # (which has no submodules at all).
        submodules: false
        fetch-depth: 0

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c # 1.88.0
      with:
        targets: ${{ matrix.target }}

    - name: Set up Buf CLI
      # thru-grpc-client's build.rs shells out to `buf build` to generate the
      # proto descriptor set; without buf on PATH the cargo build fails on
      # every target with "buf is not installed".
      uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
      with:
        setup_only: true

    - name: Install build dependencies
      if: ${{ runner.os == 'Linux' }}
      run: |
        .github/scripts/apt-install-with-retry.sh build-essential pkg-config libssl-dev libclang-dev

    - name: Set up cargo-xwin
      if: ${{ matrix.xwin }}
      run: |
        set -euo pipefail
        .github/scripts/apt-install-with-retry.sh clang lld llvm
        cargo install cargo-xwin --locked --version "${CARGO_XWIN_VERSION}"

    # x86_64 uses the distro musl-tools. aarch64 is cross-compiled with the
    # distro gcc-aarch64-linux-gnu plus the checksum-verified arm64
    # musl-dev, extracted in place rather than installed through apt
    # multiarch (which would need arm64 package sources on the runner).
    - name: Set up musl toolchain
      if: ${{ matrix.musl_cc }}
      run: |
        set -euo pipefail

        case "${{ matrix.target }}" in
          x86_64-*)
            .github/scripts/apt-install-with-retry.sh musl-tools
            ;;
          aarch64-*)
            .github/scripts/apt-install-with-retry.sh gcc-aarch64-linux-gnu
            curl -fsSL --retry 5 --retry-delay 5 -O "https://ports.ubuntu.com/ubuntu-ports/pool/universe/m/musl/${MUSL_DEV_ARM64_DEB}"
            echo "${MUSL_DEV_ARM64_SHA256}  ${MUSL_DEV_ARM64_DEB}" | sha256sum -c -
            sudo dpkg-deb -x "${MUSL_DEV_ARM64_DEB}" /
            rm "${MUSL_DEV_ARM64_DEB}"
            ;;
        esac
        "${{ matrix.musl_cc }}" --version | head -1

    - name: Cache cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-${{ matrix.target }}-cli-cargo-registry-rust-1.88-${{ hashFiles('rpc/cli/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cli-cargo-registry-rust-1.88-

    - name: Cache cargo index
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-${{ matrix.target }}-cli-cargo-index-rust-1.88-${{ hashFiles('rpc/cli/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cli-cargo-index-rust-1.88-

    - name: Cache target directory
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: rpc/cli/target
        key: ${{ runner.os }}-${{ matrix.target }}-cli-cargo-target-rust-1.88-${{ hashFiles('rpc/cli/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cli-cargo-target-rust-1.88-

    # Same convention as crates-publish.yml: the workspace crates stay at
    # 0.1.0 in the repo, so release builds must sync the manifests with the
    # release tag. This keeps CARGO_PKG_VERSION (used by version_check.rs
    # for update notifications and the user agent) aligned with the
    # published version. The intra-workspace thru-core requirement has to
    # move in lockstep or the path-dependency version check fails.
    - name: Sync crate versions with release
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${TAG_NAME#v}"
        for manifest in rpc/cli/crates/*/Cargo.toml; do
          tmp="${manifest}.tmp"
          sed -E "s|^version = \"[^\"]+\"|version = \"${VERSION}\"|" "$manifest" > "$tmp" && mv "$tmp" "$manifest"
          sed -E "s|^thru-core = \{ version = \"[^\"]+\"|thru-core = { version = \"${VERSION}\"|" "$manifest" > "$tmp" && mv "$tmp" "$manifest"
        done

        # Materialize the version bump in Cargo.lock so the --locked build
        # below sees a consistent lockfile.
        cargo metadata --format-version 1 --manifest-path rpc/cli/Cargo.toml >/dev/null

        grep -H '^version = ' rpc/cli/crates/*/Cargo.toml

    - name: Build thru CLI binary
      shell: bash
      run: |
        # Stamp the release identity (same convention as crates-publish.yml).
        # Without this the get_version! macro falls back to inference, and
        # a mismatch would make released binaries report a -local version
        # like "0.1.0-local+75e7c6d0".
        export THRU_BUILD_VERSION="${TAG_NAME#v}+$(git rev-parse --short=8 HEAD)"
        export THRU_BUILD_CHANNEL=release
        echo "THRU_BUILD_VERSION=${THRU_BUILD_VERSION}"

        # Linux legs: cc/cmake-based build scripts and the final link use the
        # musl toolchain for the target. Rust's musl targets link statically
        # by default.
        if [ "${{ matrix.xwin }}" = "true" ]; then
          cargo xwin build --release --locked --target "${{ matrix.target }}" --manifest-path rpc/cli/Cargo.toml --bin thru
        elif [ -n "${{ matrix.musl_cc }}" ]; then
          TARGET_ENV="$(echo "${{ matrix.target }}" | tr '-' '_')"
          TARGET_ENV_UPPER="$(echo "${TARGET_ENV}" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TARGET_ENV}=${{ matrix.musl_cc }}"
          export "AR_${TARGET_ENV}=${{ matrix.musl_ar }}"
          export "CARGO_TARGET_${TARGET_ENV_UPPER}_LINKER=${{ matrix.musl_cc }}"
          cargo build --release --locked --target "${{ matrix.target }}" --manifest-path rpc/cli/Cargo.toml --bin thru
        else
          cargo build --release --locked --target "${{ matrix.target }}" --manifest-path rpc/cli/Cargo.toml --bin thru
        fi

    - name: Verify Linux CLI debug info
      if: ${{ runner.os == 'Linux' && !matrix.xwin }}
      shell: bash
      run: |
        set -euo pipefail
        BIN="rpc/cli/target/${{ matrix.target }}/release/thru"
        python3 .github/scripts/verify-elf-debug-info.py "$BIN"

    # Regression guard for the portability work: fail the leg if the binary
    # stops being fully static. Any NEEDED entry, ELF interpreter or GLIBC_
    # symbol version would tie it to the build runner's libc again (glibc
    # 2.39 on Ubuntu 24.04) or to a library the target distro may lack: the
    # C dependencies (openssl, libgit2, libssh2, zlib) must stay vendored,
    # and libudev must stay unused (Ledger USB support uses hidapi's
    # pure-Rust backend; Amazon Linux 2023 containers have no libudev.so.1).
    # readelf is used instead of objdump because it handles foreign-arch
    # ELFs (the aarch64 leg is inspected on x86_64).
    - name: Assert static linking
      if: ${{ matrix.musl_cc }}
      shell: bash
      run: |
        set -euo pipefail

        BIN="rpc/cli/target/${{ matrix.target }}/release/thru"
        readelf -h "$BIN" | grep -E 'Type:|Machine:'

        # Capture readelf output first so a failed inspection fails the step
        # instead of reading as "no matches".
        DYNAMIC="$(readelf -dW "$BIN")"
        PHDRS="$(readelf -lW "$BIN")"
        VERSIONS="$(readelf -VW "$BIN")"
        NEEDED="$(grep NEEDED <<<"$DYNAMIC" || true)"
        INTERP="$(grep -i 'program interpreter' <<<"$PHDRS" || true)"
        GLIBC_REFS="$(grep -oE 'GLIBC_[0-9.]+' <<<"$VERSIONS" | sort -Vu || true)"
        if [ -n "${NEEDED}${INTERP}${GLIBC_REFS}" ]; then
          printf '%s\n' "$NEEDED" "$INTERP" "$GLIBC_REFS" >&2
          echo "::error::thru is not fully static; it would fail to launch on distros whose libc or libraries differ from the build runner's." >&2
          exit 1
        fi
        echo "Static: no NEEDED entries, no interpreter, no GLIBC_ symbol versions."

    - name: Smoke test thru CLI binary
      # aarch64-linux and Windows are cross-compiled and cannot execute on
      # their build runners (Windows is checked in smoke-test-windows-cli);
      # every other target runs natively (Darwin-x86_64 via Rosetta on the
      # arm64 macOS runners). The version assertion guards the
      # THRU_BUILD_VERSION stamping above: a binary that reports the
      # crate-default "0.1.0-local+..." must not ship.
      if: ${{ matrix.target != 'aarch64-unknown-linux-musl' && !matrix.xwin }}
      shell: bash
      run: |
        BIN_NAME="thru"
        case "${{ matrix.target }}" in
          *-windows-*) BIN_NAME="thru.exe" ;;
        esac

        VERSION_OUTPUT="$("rpc/cli/target/${{ matrix.target }}/release/${BIN_NAME}" --version)"
        echo "$VERSION_OUTPUT"
        case "$VERSION_OUTPUT" in
          *"${TAG_NAME#v}+"*) ;;
          *)
            echo "Binary reports '${VERSION_OUTPUT}', expected the release version ${TAG_NAME#v}." >&2
            exit 1
            ;;
        esac

    - name: Package thru CLI binary
      id: package-cli
      shell: bash
      run: |
        ASSET_NAME="thru-cli-${{ matrix.asset_platform }}-${TAG_NAME}"
        BIN_NAME="thru"
        case "${{ matrix.target }}" in
          *-windows-*) BIN_NAME="thru.exe" ;;
        esac

        mkdir -p "cli-artifacts/${ASSET_NAME}"
        cp "rpc/cli/target/${{ matrix.target }}/release/${BIN_NAME}" "cli-artifacts/${ASSET_NAME}/${BIN_NAME}"
        chmod 0755 "cli-artifacts/${ASSET_NAME}/${BIN_NAME}"
        tar -czf "cli-artifacts/${ASSET_NAME}.tar.gz" -C "cli-artifacts/${ASSET_NAME}" "${BIN_NAME}"

        echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

    # Cross-compiled Windows binaries go out under an unverified- name, which
    # the cli-* downloads below never match; smoke-test-windows-cli re-uploads
    # them as cli-Windows-x86_64 only after the binary runs on Windows.
    - name: Upload thru CLI artifacts to workflow
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ matrix.xwin && 'unverified-' || '' }}cli-${{ matrix.asset_platform }}
        path: cli-artifacts/${{ steps.package-cli.outputs.asset_name }}.tar.gz
        retention-days: 90

  # Run the cross-compiled Windows binary on Windows (same version assertion
  # as the build job's smoke test) and only then publish it as the
  # cli-Windows-x86_64 artifact. Best-effort like the Windows build: on any
  # failure the artifact is simply absent, as if the build had failed.
  smoke-test-windows-cli:
    needs: [build-cli-artifacts]
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      ASSET_PLATFORM: Windows-x86_64

    steps:
    - name: Download cross-compiled Windows CLI
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: unverified-cli-Windows-x86_64
        path: unverified

    - name: Smoke test thru CLI binary
      shell: bash
      run: |
        set -euo pipefail
        ASSET_NAME="thru-cli-${ASSET_PLATFORM}-${TAG_NAME}"
        mkdir -p extracted
        tar -xzf "unverified/${ASSET_NAME}.tar.gz" -C extracted

        VERSION_OUTPUT="$(extracted/thru.exe --version)"
        echo "$VERSION_OUTPUT"
        case "$VERSION_OUTPUT" in
          *"${TAG_NAME#v}+"*) ;;
          *)
            echo "Binary reports '${VERSION_OUTPUT}', expected the release version ${TAG_NAME#v}." >&2
            exit 1
            ;;
        esac
        extracted/thru.exe --help >/dev/null

    - name: Upload verified Windows CLI artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-Windows-x86_64
        path: unverified/thru-cli-Windows-x86_64-${{ env.TAG_NAME }}.tar.gz
        retention-days: 90

  # Attach the CLI artifacts and checksums to the GitHub release.
  upload-cli-release-artifacts:
    needs: [build-cli-artifacts, smoke-test-windows-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_exists: ${{ steps.release-check.outputs.exists }}
      packages_built: ${{ steps.build-packages.outputs.built }}
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      NFPM_PKG_VERSION: "2.46.3"

    steps:
    # Only needed for .github/nfpm/thru-cli.yaml; checkout must come first
    # because it cleans the workspace. The packaging step degrades to a
    # warning when the config is absent (workflow_dispatch against a tag
    # that predates deb/rpm packaging).
    - name: Checkout packaging config
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        submodules: false

    - name: Download thru CLI artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: cli-release-artifacts
        pattern: cli-*

    # .deb/.rpm packages are nFPM-wrapped copies of the Linux tarball
    # binaries, so cloud VMs without npm can `apt install ./thru_*.deb` or
    # `dnf install <release-url>.rpm` straight from the release assets.
    # nfpm is checksum-verified against its release manifest and pinned by
    # NFPM_PKG_VERSION.
    - name: Build thru .deb and .rpm packages
      id: build-packages
      run: |
        set -euo pipefail

        if [ ! -f .github/nfpm/thru-cli.yaml ]; then
          echo "::warning::.github/nfpm/thru-cli.yaml not present at ${TAG_NAME}; skipping .deb/.rpm packaging."
          echo "built=false" >> "$GITHUB_OUTPUT"
          mkdir -p cli-packages
          exit 0
        fi

        NFPM_TARBALL="nfpm_${NFPM_PKG_VERSION}_Linux_x86_64.tar.gz"
        curl -fsSL --retry 5 --retry-delay 5 -O "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_PKG_VERSION}/${NFPM_TARBALL}"
        curl -fsSL --retry 5 --retry-delay 5 -o nfpm-checksums.txt "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_PKG_VERSION}/checksums.txt"
        grep " ${NFPM_TARBALL}\$" nfpm-checksums.txt | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "${NFPM_TARBALL}" -C "$HOME/.local/bin" nfpm
        rm "${NFPM_TARBALL}" nfpm-checksums.txt

        VERSION="${TAG_NAME#v}"
        mkdir -p cli-packages
        while read -r asset_platform nfpm_arch; do
          tarball="$(find cli-release-artifacts -type f -name "thru-cli-${asset_platform}-${TAG_NAME}.tar.gz" -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::warning::No ${asset_platform} tarball in this run; skipping its .deb/.rpm."
            continue
          fi
          workdir="$(mktemp -d)"
          tar -xzf "$tarball" -C "$workdir"
          export NFPM_VERSION="$VERSION" NFPM_ARCH="$nfpm_arch" NFPM_BIN="$workdir/thru"
          "$HOME/.local/bin/nfpm" package -f .github/nfpm/thru-cli.yaml -p deb -t cli-packages/
          "$HOME/.local/bin/nfpm" package -f .github/nfpm/thru-cli.yaml -p rpm -t cli-packages/
        done <<'EOF'
        Linux-x86_64 amd64
        Linux-aarch64 arm64
        EOF

        ls -l cli-packages
        if [ -n "$(ls -A cli-packages)" ]; then
          echo "built=true" >> "$GITHUB_OUTPUT"
        else
          echo "built=false" >> "$GITHUB_OUTPUT"
        fi

    # Kept as a workflow artifact so test-linux-packages (and dispatch
    # dry-runs without a release) can consume the packages from this run.
    - name: Upload thru package artifacts to workflow
      if: ${{ steps.build-packages.outputs.built == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-packages
        path: cli-packages/
        retention-days: 90
        if-no-files-found: error

    # On workflow_dispatch the requested tag may not have a release (e.g. a
    # dry-run build); keep the artifacts on the workflow run instead of
    # failing the upload. publish-npm also keys off this so dry-runs never
    # publish to npm.
    - name: Check release exists
      id: release-check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No release found for ${TAG_NAME}; CLI artifacts remain on this workflow run only."
        fi

    # releases/latest/download/ resolves against the newest non-prerelease
    # release, so that is the only release where an alias does anything. A
    # workflow_dispatch rebuild of an older tag would otherwise publish aliases
    # to a release nothing points at AND prune them off the real latest one,
    # 404ing every install URL in the docs until the next release.
    - name: Resolve whether this is the latest release
      id: latest-check
      if: ${{ steps.release-check.outputs.exists == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        latest="$(gh release view --repo "${{ github.repository }}" \
                    --json tagName --jq .tagName 2>/dev/null || true)"
        if [ "${latest}" = "${TAG_NAME}" ]; then
          echo "is_latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
          echo "::warning::${TAG_NAME} is not the latest release (${latest:-none}); leaving the unversioned aliases alone."
        fi

    # Unversioned copies of the Linux packages, so the install docs can point at
    # releases/latest/download/<name> and never pin a version. GitHub resolves
    # that path by exact asset name and has no asset symlink, so the alias has
    # to exist as a real asset. Kept out of cli-packages/ so the cli-packages
    # artifact and the test-linux-packages globs stay untouched.
    - name: Create unversioned package aliases
      run: |
        set -euo pipefail

        mkdir -p cli-package-aliases
        while read -r glob alias; do
          src="$(find cli-packages -maxdepth 1 -type f -name "$glob" -print -quit)"
          if [ -z "$src" ]; then
            echo "::warning::No ${glob} in this run; skipping its ${alias} alias."
            continue
          fi
          cp "$src" "cli-package-aliases/${alias}"
        done <<'EOF'
        thru_*_amd64.deb thru_amd64.deb
        thru_*_arm64.deb thru_arm64.deb
        thru-*.x86_64.rpm thru-x86_64.rpm
        thru-*.aarch64.rpm thru-aarch64.rpm
        EOF

        ls -l cli-package-aliases

    # Must be a cli-* artifact: publish-npm downloads that pattern and runs
    # `sha256sum -c` over every line of thru-cli-SHA256SUMS, which now includes
    # the aliases. Without this the four alias files are missing there and npm
    # publishing fails on every release.
    - name: Upload thru package aliases to workflow
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-package-aliases
        path: cli-package-aliases/
        retention-days: 90
        if-no-files-found: ignore

    # The checksums file is scoped with a thru-cli- prefix because the
    # release hosts assets from several workflows; a bare SHA256SUMS that
    # only covers the CLI tarballs would be misleading next to them. It
    # covers the .deb/.rpm packages too, since they wrap the same binaries.
    - name: Create thru CLI checksums
      env:
        IS_LATEST: ${{ steps.latest-check.outputs.is_latest }}
      run: |
        set -euo pipefail

        # The aliases are only uploaded to the latest release, so only that
        # release's checksum file may list them. Listing them anywhere else
        # publishes a SHA256SUMS naming assets that release does not have, and
        # `sha256sum -c` fails for anyone verifying it. publish-npm is
        # unaffected either way: it verifies the workflow artifacts, where the
        # alias files always exist, and unlisted extra files are ignored.
        alias_checksum_files() {
          if [ "${IS_LATEST:-false}" = "true" ]; then
            find cli-package-aliases -type f \( -name '*.deb' -o -name '*.rpm' \)
          fi
        }

        : > cli-release-artifacts/thru-cli-SHA256SUMS
        while IFS= read -r file; do
          hash=$(sha256sum "$file" | awk '{print $1}')
          filename=$(basename "$file")
          printf '%s  %s\n' "$hash" "$filename" >> cli-release-artifacts/thru-cli-SHA256SUMS
        done < <( { find cli-release-artifacts/cli-* -type f -name 'thru-cli-*.tar.gz';
                    find cli-packages -type f \( -name '*.deb' -o -name '*.rpm' \);
                    alias_checksum_files; } | sort)

        cat cli-release-artifacts/thru-cli-SHA256SUMS

    # Also keep the checksums as a workflow artifact so publish-npm can
    # verify the binaries it consumes from this same run.
    - name: Upload thru CLI checksums to workflow
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-SHA256SUMS
        path: cli-release-artifacts/thru-cli-SHA256SUMS
        retention-days: 90

    - name: Upload thru CLI artifacts
      if: ${{ steps.release-check.outputs.exists == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for artifact_dir in cli-release-artifacts/cli-*; do
          if [ -d "$artifact_dir" ]; then
            echo "Processing $artifact_dir"
            for file in "$artifact_dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                echo "Uploading $filename"
                gh release upload "${TAG_NAME}" "$file" --repo "${{ github.repository }}" --clobber
              fi
            done
          fi
        done

        for file in cli-packages/*.deb cli-packages/*.rpm; do
          if [ -f "$file" ]; then
            echo "Uploading $(basename "$file")"
            gh release upload "${TAG_NAME}" "$file" --repo "${{ github.repository }}" --clobber
          fi
        done

        gh release upload "${TAG_NAME}" cli-release-artifacts/thru-cli-SHA256SUMS --repo "${{ github.repository }}" --clobber

    - name: Upload unversioned package aliases
      if: ${{ steps.release-check.outputs.exists == 'true' && steps.latest-check.outputs.is_latest == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        for file in cli-package-aliases/*; do
          if [ -f "$file" ]; then
            echo "Uploading $(basename "$file")"
            gh release upload "${TAG_NAME}" "$file" --repo "${{ github.repository }}" --clobber
          fi
        done

    # releases/latest/download/ only ever resolves against the newest release, so
    # an alias left on an older one is unreachable through any URL the docs emit
    # (a direct link to an old release uses the versioned name). Dropping them
    # keeps the duplication flat at one release's worth instead of growing a tail.
    # Exact names only, never a glob: this deletes assets from a public repo, and
    # a glob that drifted could take the versioned packages with it. Sweeps every
    # non-current release rather than just the previous one, so a failed run heals
    # itself on the next release.
    - name: Prune unversioned aliases from older releases
      if: ${{ steps.release-check.outputs.exists == 'true' && steps.latest-check.outputs.is_latest == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        for tag in $(gh release list --repo "${{ github.repository }}" --limit 100 \
                       --json tagName --jq '.[].tagName'); do
          [ "$tag" = "${TAG_NAME}" ] && continue
          for alias in thru_amd64.deb thru_arm64.deb thru-x86_64.rpm thru-aarch64.rpm; do
            if gh release delete-asset "$tag" "$alias" \
                 --repo "${{ github.repository }}" --yes 2>/dev/null; then
              echo "Pruned ${alias} from ${tag}"
            fi
          done
        done

    - name: CLI Release Summary
      if: ${{ steps.release-check.outputs.exists == 'true' }}
      run: |
        echo "✅ Successfully uploaded thru CLI artifacts to release ${TAG_NAME}!"
        echo ""
        echo "thru CLI artifacts:"
        find cli-release-artifacts/cli-* cli-packages -type f -exec basename {} \; 2>/dev/null | sort || echo "  No CLI artifacts found"
        echo ""
        echo "Checksums:"
        cat cli-release-artifacts/thru-cli-SHA256SUMS

  # Install the freshly built .deb/.rpm in clean containers and run the
  # binary. This is the executable proof of portability: all of these
  # distros ship a glibc older than the 24.04 build runner's (ubuntu 22.04 =
  # 2.35, debian 12 = 2.36, amazonlinux 2023 and rocky 9 = 2.34), so a plain
  # gnu build from that runner fails to even launch here. x86_64 only: the
  # runners cannot execute aarch64 binaries (that leg is covered by the
  # static-linking assertion in build-cli-artifacts).
  test-linux-packages:
    needs: [upload-cli-release-artifacts]
    if: ${{ needs.upload-cli-release-artifacts.outputs.packages_built == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -qq -y /pkgs/thru_*_amd64.deb
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -qq -y /pkgs/thru_*_amd64.deb
          - image: debian:12
            install: apt-get update -qq && apt-get install -qq -y /pkgs/thru_*_amd64.deb
          - image: amazonlinux:2023
            install: dnf install -q -y /pkgs/thru-*.x86_64.rpm
          - image: rockylinux:9
            install: dnf install -q -y /pkgs/thru-*.x86_64.rpm

    steps:
      - name: Download thru package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-packages
          path: cli-packages

      - name: Install package and run thru
        run: |
          set -euo pipefail

          docker run --rm -v "$PWD/cli-packages:/pkgs:ro" "${{ matrix.image }}" bash -c '
            set -euo pipefail
            ${{ matrix.install }}
            thru --version
          '

  # Publish the CLI npm packages: the platform packages carry the binaries
  # built in this run (npm selects the right one through os/cpu +
  # optionalDependencies — no postinstall, no network access at install time
  # beyond the npm registry), then `thru` itself. Guards:
  # - repository: only thru-net has NPM_TOKEN (the secrets context is not
  #   available in job-level `if`, so the repository name stands in for it);
  # - prerelease: never published to npm (release flag on release events, a
  #   `-` suffix in the tag on dispatch);
  # - release_exists: a dispatch dry-run for a tag without a release builds
  #   artifacts but must not publish.
  publish-npm:
    needs: [upload-cli-release-artifacts]
    if: >-
      ${{ github.repository == 'Unto-Labs/thru-net' &&
          needs.upload-cli-release-artifacts.outputs.release_exists == 'true' &&
          (github.event_name != 'release' || github.event.release.prerelease != true) &&
          (github.event_name != 'workflow_dispatch' || !contains(inputs.tag, '-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Determine release version
        id: meta
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Unable to derive version from tag '$TAG_NAME'" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "Refusing to publish prerelease version $VERSION to npm." >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # The CLI npm package is self-contained JS; no submodules needed.
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download thru CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: cli-release-artifacts
          pattern: cli-*

      - name: Verify and extract thru CLI binaries
        run: |
          set -euo pipefail

          # The .deb/.rpm packages ride along (the cli-* artifact pattern
          # matches cli-packages) purely so the checksum verification below
          # covers every line of thru-cli-SHA256SUMS; npm packaging only
          # consumes the tarballs.
          mkdir -p cli-assets
          find cli-release-artifacts -type f \
            \( -name 'thru-cli-*.tar.gz' -o -name 'thru-cli-SHA256SUMS' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec mv {} cli-assets/ \;

          cd cli-assets
          sha256sum -c thru-cli-SHA256SUMS

          mkdir -p ../cli-binaries
          for archive in thru-cli-*.tar.gz; do
            base="${archive%.tar.gz}"
            asset_platform="${base#thru-cli-}"
            asset_platform="${asset_platform%-${TAG_NAME}}"
            mkdir -p "../cli-binaries/${asset_platform}"
            tar -xzf "$archive" -C "../cli-binaries/${asset_platform}"
          done

          echo "Extracted thru CLI binaries:"
          find ../cli-binaries -type f

      - name: Sync thru package version
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          tmp=$(mktemp)
          jq --arg v "$RELEASE_VERSION" '.version = $v' web/packages/cli/package.json > "$tmp"
          mv "$tmp" web/packages/cli/package.json
          echo "Set thru version to $RELEASE_VERSION"

      - name: Run thru package tests
        working-directory: web/packages/cli
        run: node --test

      - name: Generate thru platform packages
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node web/packages/cli/scripts/make-platform-packages.mjs \
            --version "$RELEASE_VERSION" \
            --binaries-dir "$PWD/cli-binaries" \
            --out-dir web/packages/cli/npm \
            --optional win32-x64

      - name: Check packaging invariants
        working-directory: web/packages/cli
        run: node scripts/check-package.mjs

      # Platform packages must be live before `thru` itself is published so
      # that its optionalDependencies are resolvable the moment it appears.
      # Both publish steps are idempotent, so a dispatch re-run fills in
      # whatever a previous attempt missed.
      - name: Publish thru platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured." >&2
            exit 1
          fi

          for pkg_dir in web/packages/cli/npm/*/; do
            name=$(jq -r '.name' "${pkg_dir}package.json")
            version=$(jq -r '.version' "${pkg_dir}package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already published"
              continue
            fi
            echo "Publishing ${name}@${version}"
            npm publish "$pkg_dir" --access public
          done

      # A successful publish can mean npm accepted the package for processing,
      # not that installs can resolve it yet. Optional dependencies silently
      # disappear from installs if the wrapper becomes visible first.
      - name: Wait for thru platform packages on npm
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            pending=()
            for pkg_dir in web/packages/cli/npm/*/; do
              name=$(jq -r '.name' "${pkg_dir}package.json")
              version=$(jq -r '.version' "${pkg_dir}package.json")
              if ! npm view "${name}@${version}" version --prefer-online >/dev/null 2>&1; then
                pending+=("${name}@${version}")
              fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Platform packages are not visible on the registry: ${pending[*]}" >&2
              exit 1
            fi
            echo "Waiting for ${pending[*]} on the registry (attempt ${attempt}/20)"
            sleep 30
          done

      - name: Publish thru to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "thru@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping thru@${RELEASE_VERSION}: already published"
            exit 0
          fi
          npm publish web/packages/cli --access public

      # End-to-end check of what consumers actually get: a fresh `npm exec`
      # must resolve thru@VERSION plus its linux-x64 platform package from
      # the public registry and run the native binary. Retry the whole install:
      # metadata can be visible before a platform tarball is downloadable, and
      # npm can silently omit that optional dependency. Never reuse an incomplete
      # npx install; persistent install or execution failures still fail the job.
      - name: Verify published thru CLI
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          verification_root=$(mktemp -d)
          trap 'rm -rf "$verification_root"' EXIT

          for attempt in $(seq 1 10); do
            attempt_dir="$verification_root/$attempt"
            mkdir -p "$attempt_dir"
            if (
              cd "$attempt_dir"
              npm exec --yes --prefer-online --loglevel verbose \
                --cache "$attempt_dir/cache" \
                --package "thru@${RELEASE_VERSION}" -- thru --version
            ); then
              exit 0
            fi
            # Preserve npm's reason for dropping an optional dependency.
            if [ -d "$attempt_dir/cache/_logs" ]; then
              find "$attempt_dir/cache/_logs" -name '*-debug-0.log' -exec cat {} +
            fi
            rm -rf "$attempt_dir"
            if [ "$attempt" -eq 10 ]; then
              echo "Fresh install of thru@${RELEASE_VERSION} failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Retrying fresh install of thru@${RELEASE_VERSION} (attempt ${attempt}/10)"
            sleep 30
          done
