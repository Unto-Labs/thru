# PerpError.code is the program's user error code as an unsigned 64-bit
# value (two's complement of the signed code). The perp program shares the
# spot CLOB error table and adds these program specific codes:
#   -205 PRICE_ABOVE_CAP           order price above market.price_cap
#   -206 INVALID_PRICE_CAP         market create: bad price cap
#   -207 INVALID_POSITION_LIMIT    market create: bad max_position_lots
#   -208 POSITION_LIMIT            order would exceed max_position_lots
#   -209 ARITH_OVERFLOW            intermediate does not fit
#   -210 ORACLE_MISSING            market record has no oracle feed account
#   -211 ORACLE_MISMATCH           feed pubkey != market.oracle_feed_pubkey
#   -212 ORACLE_INVALID            feed size/type/exponent invalid or mark is 0
#   -213 ORACLE_STALE              feed older than max_mark_age_ns / max_staleness_ns
#   -214 INVALID_MARGIN_PARAMS     market create/set oracle: bad bps or mark_den == 0
#   -215 NOT_LIQUIDATABLE          target has no position or equity >= maintenance margin
#   -216 SELF_LIQUIDATION          liquidator seat == target seat
#   -403 INSUFFICIENT_COLLATERAL   free margin would go negative
- name: PerpError
  kind:
    struct:
      packed: true
      fields:
      - name: code
        field-type:
          primitive: u64
