<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="thru-mobile-tokens.css">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;}
a{color:var(--m-accent);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:3px;}
</style>
</helmet>
<div data-screen-label="Tokens screen" style="position:absolute;top:0;left:0;right:0;bottom:0;background:var(--m-bg);color:var(--m-fg);font-family:'Inter Tight',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div aria-hidden="true" style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 10px 32px;flex:none">
    <span style="font-size:15px;font-weight:600;letter-spacing:-0.2px">9:41</span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:var(--m-fg)"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4"></rect><rect x="5" y="5.5" width="3" height="6.5"></rect><rect x="10" y="3" width="3" height="9"></rect><rect x="15" y="0" width="3" height="12"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0M4 7.2a6 6 0 0 1 8 0M6.5 9.9a2.4 2.4 0 0 1 3 0"></path></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" stroke="currentColor"></rect><rect x="2" y="2" width="19" height="8" fill="currentColor"></rect><rect x="24" y="4" width="2" height="4" fill="currentColor"></rect></svg></span>
  </div>
  <div style="display:flex;align-items:center;height:52px;padding:0 6px;border-bottom:1px solid var(--m-border);flex:none">
    <button type="button" aria-label="Back to Home" style="width:44px;height:44px;display:grid;place-items:center;border:none;background:none;padding:0;cursor:pointer;color:var(--m-fg)" style-active="background:var(--m-bg-muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg></button>
    <span style="flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-0.25px">Tokens</span>
    <span style="width:44px;height:44px"></span>
  </div>
  <div style="flex:1;min-height:0;overflow:hidden">
    <div style="transform:translateY({{ scrollT }})">
      <dc-import name="Token List" state="{{ state }}" hint-size="100%,600px"></dc-import>
      <div style="height:34px"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;many&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;empty&quot;,&quot;edge&quot;,&quot;many&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;scrollY&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { state: p.state ?? 'many', scrollT: '-' + Number(p.scrollY ?? 0) + 'px' };
  }
}
</script>
</body>
</html>
