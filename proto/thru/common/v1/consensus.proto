syntax = "proto3";

package thru.common.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Unto-Labs/thru-net/grpc/pkg/proto/thru/common/v1;commonv1";
option java_multiple_files = true;
option java_package = "network.thru.common.v1";
option csharp_namespace = "Thru.Common.V1";
option ruby_package = "Thru::Common::V1";
option objc_class_prefix = "THU";
option swift_prefix = "THU";

// ConsensusStatus is the level a resource has reached when the service
// returns it.
//
// The values form a chain: each level implies every lower one. The reported
// level is the highest level whose condition holds, and numeric comparisons
// (for example `consensus_status >= int(3)`) are valid.
enum ConsensusStatus {
  // CONSENSUS_STATUS_UNSPECIFIED indicates the consensus status is unknown.
  CONSENSUS_STATUS_UNSPECIFIED = 0;

  // CONSENSUS_STATUS_OBSERVED is never reported by thrud today. It is
  // accepted as a minimum and is satisfied by anything thrud returns.
  CONSENSUS_STATUS_OBSERVED = 1;

  // CONSENSUS_STATUS_INCLUDED indicates the resource was ordered by consensus
  // and delivered to this node. An execution result may already be attached.
  CONSENSUS_STATUS_INCLUDED = 2;

  // CONSENSUS_STATUS_FINALIZED indicates the resource is included and its
  // slot is finalized. No execution result has arrived yet on this
  // connection.
  CONSENSUS_STATUS_FINALIZED = 3;

  // CONSENSUS_STATUS_LOCALLY_EXECUTED indicates the resource is finalized and
  // was executed by this node (for stored data: by the node that produced the
  // data). It implies finalized.
  CONSENSUS_STATUS_LOCALLY_EXECUTED = 4;

  // CONSENSUS_STATUS_CLUSTER_EXECUTED is not reported yet (see UNTO-3677) and
  // is rejected as a minimum. Future meaning: the post-state is attested by a
  // later finalization certificate (finalization quorum, more than 1/5 of
  // stake) and matched by this node.
  CONSENSUS_STATUS_CLUSTER_EXECUTED = 5;
}

// VersionContext selects which logical version of a resource should be
// returned. At least one field must be set.
message VersionContext {
  option (buf.validate.message).cel = {
    id: "version_context_has_selector"
    message: "one of current, currentOrHistorical, slot, timestamp, or slot_seq must be set"
    expression: "has(this.current) || has(this.currentOrHistorical) || has(this.slot) || has(this.timestamp) || has(this.slot_seq)"
  };

  // Specifies the desired version semantics.
  oneof version {
    // Request the latest version available at request time.
    CurrentVersion current = 1 [(google.api.field_behavior) = OPTIONAL];

    // Request the latest version, or historical on.
    CurrentOrHistoricalVersion currentOrHistorical = 2 [(google.api.field_behavior) = OPTIONAL];

    // Request the newest account version at or before this slot.
    // GetAccount, GetRawAccount and BatchGetRawAccounts require the serving
    // node's completed account history to cover the slot. A pin above that
    // history cursor returns FAILED_PRECONDITION; retry once history covers
    // it. The error calls this frontier the "durable cursor"; it is not the
    // live WAL frontier or finalized height and may trail both. Without a
    // committed history marker, even slot zero returns UNAVAILABLE.
    uint64 slot = 3 [(google.api.field_behavior) = OPTIONAL];

    // Request the version nearest to the provided block timestamp.
    google.protobuf.Timestamp timestamp = 4
        [(google.api.field_behavior) = OPTIONAL];

    // Request the account version written at an exact (slot, seq) point.
    // Relevant only for GetAccount and GetRawAccount requests. They require
    // completed history to cover slot_seq.slot, with the same history cursor
    // and error contract as the slot selector.
    SlotSeq slot_seq = 5 [(google.api.field_behavior) = OPTIONAL];
  }
}

// CurrentVersion is an empty marker message for VersionContext.current.
message CurrentVersion {}

// CurrentOrHistoricalVersion is an empty marker message for VersionContext.current.
message CurrentOrHistoricalVersion {}

// SlotSeq identifies an exact account version: the row written in `slot`
// carrying per-account sequence number `seq`.  A bare seq is not a version
// key -- it restarts across account incarnations -- so it is only
// meaningful scoped to a slot.
message SlotSeq {
  uint64 slot = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 seq = 2 [(google.api.field_behavior) = REQUIRED];
}
